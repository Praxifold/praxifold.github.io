    function cleanText(text) {
        return text.toLowerCase().replace(/[^a-ząčęėįšųūž0-9\s]/g, '');
    }

    function levenshtein(a, b) {
        const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
        for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + cost
                );
            }
        }
        return matrix[a.length][b.length];
    }

    function extractVocabulary() {
        const vocab = new Set();
        brain.forEach(item => {
            cleanText(item.q).split(' ').forEach(token => {
                if (token.length > 2) vocab.add(token);
            });
        });
        Object.keys(lithuanianSynonyms).forEach(k => vocab.add(k));
        return Array.from(vocab);
    }

    function spellCorrectTokens(tokens) {
        const vocab = extractVocabulary();
        return tokens.map(token => {
            if (vocab.includes(token)) return token;
            let bestWord = token;
            let minDistance = 2;
            
            vocab.forEach(word => {
                const dist = levenshtein(token, word);
                if (dist < minDistance) {
                    minDistance = dist;
                    bestWord = word;
                }
            });
            return bestWord;
        });
    }

    function expandSynonyms(tokens) {
        let expanded = [...tokens];
        tokens.forEach(token => {
            if (lithuanianSynonyms[token]) {
                expanded.push(...lithuanianSynonyms[token]);
            }
            Object.entries(lithuanianSynonyms).forEach(([key, list]) => {
                if (list.includes(token)) {
                    expanded.push(key);
                    expanded.push(...list);
                }
            });
        });
        return Array.from(new Set(expanded));
    }

    function matchBrain(tokens) {
        let bestMatch = null;
        let highestScore = 0;

        for (const memory of brain) {
            const memoryTokens = cleanText(memory.q).split(' ').filter(t => t.length > 0);
            let score = 0;

            for (const token of tokens) {
                if (memoryTokens.includes(token)) score++;
            }

            const lengthDiff = Math.abs(tokens.length - memoryTokens.length);
            const finalScore = score - (lengthDiff * 0.1);

            if (finalScore > highestScore) {
                highestScore = finalScore;
                bestMatch = memory.a;
            }
        }
        return highestScore > 0.4 ? bestMatch : null;
    }

    function getBestResponse(userInput) {
        let tokens = cleanText(userInput).split(' ').filter(t => t.length > 0);
        
        let response = matchBrain(tokens);
        if (response) return response;

        const correctedTokens = spellCorrectTokens(tokens);
        response = matchBrain(correctedTokens);
        if (response) return response;

        const synonymTokens = expandSynonyms(correctedTokens);
        response = matchBrain(synonymTokens);
        if (response) return response;

        return "Atsiprašau, nesupratau klausimo.";
    }

    async function signPayload(message, secret) {
        const encoder = new TextEncoder();
        const keyData = encoder.encode(secret);
        const msgData = encoder.encode(message);
        
        const cryptoKey = await crypto.subtle.importKey(
            'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
        );
        const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
        return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function sendToGoogleSheet(question, answer) {
        if (!GAS_URL || !SECRET_KEY) return;
        
        const timestamp = new Date().toISOString();
        const payloadToSign = `${question}:${timestamp}`;
        const signature = await signPayload(payloadToSign, SECRET_KEY);

        const body = {
            question: question,
            answer: answer,
            timestamp: timestamp,
            signature: signature
        };

        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(body)
        }).catch(err => console.error("Sheet error:", err));
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + (sender === 'user' ? 'msg-user' : 'msg-ai');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        setTimeout(() => {
            const response = getBestResponse(text);
            appendMessage(response, 'ai');
            sendToGoogleSheet(text, response);
        }, 300);
    }

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
</script>
