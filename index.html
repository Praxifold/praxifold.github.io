<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Praxifold</title>
<style>
:root{--bg:#000000;--panel:#080d1a;--panel2:#0c1426;--border:#162545;--text:#c8d8f0;--dim:#4a6a9a;--accent:#4080ff;--accent2:#1c5fd4;--danger:#e53e3e;--ok:#38a169;--r:10px;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h2,h3{font-weight:700;letter-spacing:-.02em}
.hidden{display:none!important}
.muted{color:var(--dim);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.card+.card{margin-top:14px}
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 13px;font-size:14px;font-family:var(--font);margin-top:4px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(64,128,255,.18)}
select option{background:var(--panel2)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;color:var(--dim);margin-top:12px;font-weight:500;letter-spacing:.02em}
label.inline{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--text);margin-top:14px;cursor:pointer;font-weight:400;letter-spacing:0}
label.inline input[type=checkbox]{width:auto;margin:2px 0 0;flex-shrink:0}
.field{margin-bottom:2px}
.pw-wrap{position:relative;margin-top:4px}
.pw-wrap input{margin-top:0;padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--dim);padding:4px;font-size:15px;line-height:1;transition:color .15s}
.pw-eye:hover{color:var(--text)}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s,transform .1s,background .15s;font-family:var(--font)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){opacity:.88}
.btn-sm{padding:6px 13px;font-size:13px}
.btn-block{width:100%;margin-top:14px}
.mini-spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes rot{to{transform:rotate(360deg)}}
.alert{padding:11px 14px;border-radius:8px;font-size:14px;margin:10px 0}
.alert-error{background:rgba(229,62,62,.12);border:1px solid rgba(229,62,62,.4);color:#fca5a5}
.alert-ok{background:rgba(56,161,105,.12);border:1px solid rgba(56,161,105,.4);color:#86efac}
.alert-info{background:rgba(64,128,255,.1);border:1px solid rgba(64,128,255,.35);color:#93c5fd}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:40}
.brand{display:flex;align-items:center;cursor:pointer}
.brand img{height:32px;width:auto;display:block}
.topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-right:4px}
.lang-toggle button{background:none;border:none;color:var(--dim);padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s,color .15s}
.lang-toggle button.active{background:var(--panel2);color:var(--accent)}
main{max-width:1060px;margin:0 auto;padding:30px 18px 120px}
.fade-in{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dec-load{text-align:center;padding:70px 10px;color:var(--dim);font-size:15px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.hero{text-align:center;padding:64px 10px 10px}
.hero h1{font-size:40px;font-weight:800;margin-bottom:10px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--text),#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--dim);font-size:16px;margin-bottom:28px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sublink{margin-top:18px;font-size:14px;color:var(--dim);cursor:pointer;text-decoration:underline;display:inline-block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:none;color:var(--dim);padding:10px 15px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font);transition:color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row span{font-size:14px}
.sw{position:relative;width:40px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;margin:0}
.sl{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.2s}
.sl::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:var(--accent)}
input:checked+.sl::before{transform:translateX(18px)}
.switch-row .sw input:disabled+.sl{opacity:.5;cursor:not-allowed}
.sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 0 8px;font-weight:600}
.tag-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
.pill.active{border-color:var(--ok);color:var(--ok)}
.pill.pending{border-color:var(--accent);color:var(--accent)}
.pill.lost{border-color:var(--danger);color:#fca5a5}
.copy-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.copy-row input{flex:1;margin:0;font-size:12px;font-family:monospace;background:var(--bg)}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{overflow:hidden;padding:0;transition:border-color .15s;cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pphoto{width:100%;aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;overflow:hidden}
.pphoto img{width:100%;height:100%;object-fit:cover}
.pbody{padding:14px}
.pbody h4{margin-bottom:4px;font-size:15px}
.pprice{color:var(--accent);font-weight:700;font-size:18px;margin:5px 0}
.cat-ctrls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cat-ctrls input{flex:1;min-width:160px;margin:0}
.cat-ctrls select{width:auto;margin:0}
.gal-main{background:var(--panel);border-radius:8px;aspect-ratio:1;max-height:380px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--dim)}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal-th{display:flex;gap:8px;margin-top:8px}
.gal-th img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid var(--border);cursor:pointer;margin:0;padding:0}
.gal-th img.on{border-color:var(--accent)}
.hint{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4}
.adm-sec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.adm-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.adm-sec h4{margin-bottom:12px;font-size:15px;color:var(--text)}
footer{text-align:center;padding:24px 18px 60px;color:var(--dim);font-size:13px}
footer a{margin:0 8px;color:var(--dim)}footer a:hover{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:24px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;animation:fi .18s ease}
.modal.wide{max-width:640px}
.modal h3{margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#cookie{position:fixed;bottom:0;left:0;right:0;background:var(--panel2);border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:60}
#cookie p{font-size:14px;color:var(--dim);margin:0;max-width:580px}
#cookie .ca{display:flex;gap:8px}
#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:8px;font-size:14px;max-width:320px;animation:fi .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast-ok{background:#166534;color:#bbf7d0;border:1px solid #16a34a}
.toast-error{background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444}
.toast-info{background:#1e3a5f;color:#93c5fd;border:1px solid #3b82f6}
.scan-card{max-width:480px;margin:40px auto;word-break:break-word;overflow-wrap:break-word}
.scan-safe{display:flex;align-items:center;gap:8px;background:rgba(56,161,105,.12);border:1px solid rgba(56,161,105,.4);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--ok);font-weight:600}
.scan-emg{display:flex;align-items:flex-start;gap:10px;background:rgba(229,62,62,.12);border:1px solid rgba(229,62,62,.5);border-radius:8px;padding:12px 14px;margin:12px 0;color:#fca5a5;font-size:14px;line-height:1.5}
.scan-lost{background:rgba(229,62,62,.12);border:1px solid rgba(229,62,62,.5);border-radius:8px;padding:14px;margin:12px 0;color:#fca5a5;font-size:14px;line-height:1.6}
.info-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;flex-wrap:wrap}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--dim);min-width:140px;flex-shrink:0}
.info-row .val{flex:1;min-width:0;word-break:break-word;overflow-wrap:break-word}
#geo-loading{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#geo-block{position:fixed;inset:0;background:#000;z-index:201;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#maint{position:fixed;inset:0;background:#000;z-index:150;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#maint .lang-toggle{position:absolute;top:16px;right:16px}
#dev-warn{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444;padding:11px 20px;border-radius:8px;z-index:95;font-size:14px;animation:fi .2s ease;max-width:340px;text-align:center}
.opt-hint{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px;font-style:italic}
#ai-fab{position:fixed;bottom:28px;right:22px;z-index:50;display:flex;align-items:flex-end;gap:9px}
.ai-info-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;font-style:italic;font-weight:700;flex-shrink:0;margin-bottom:19px;transition:border-color .15s,color .15s;position:relative}
.ai-info-btn:hover{border-color:var(--accent);color:var(--accent)}
.ai-tooltip{position:absolute;bottom:32px;right:0;width:220px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--text);line-height:1.6;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);font-style:normal;font-weight:400;pointer-events:none}
.ai-tooltip.vis{display:block}
.ai-circle-btn{width:64px;height:64px;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#1a2d5e 0%,#050b1a 70%);border:1px solid rgba(80,130,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 22px rgba(64,128,255,.2),inset 0 0 18px rgba(64,128,255,.07);transition:box-shadow .3s,border-color .3s;flex-shrink:0}
.ai-circle-btn:hover{box-shadow:0 0 36px rgba(64,128,255,.4),inset 0 0 22px rgba(64,128,255,.15);border-color:rgba(100,160,255,.7)}
.ai-circle-btn .ai-label{font-size:16px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#7cb8ff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;user-select:none}
.ai-beta{position:absolute;top:-5px;right:-7px;background:#4080ff;color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:999px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.15)}
.srp{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:4px}
.sm-info-wrap{position:relative;display:inline-flex;align-items:center}
.sm-info-icon{cursor:pointer;color:var(--dim);font-size:13px;font-style:normal;margin-left:5px;user-select:none;transition:color .15s;line-height:1}
.sm-info-icon:hover{color:var(--accent)}
.sm-info-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:230px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text);line-height:1.5;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:normal;pointer-events:none;font-weight:400}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.scan-lang-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:14px;width:fit-content}
.scan-lang-toggle button{background:none;border:none;color:var(--dim);padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s,color .15s}
.scan-lang-toggle button.active{background:var(--panel2);color:var(--accent)}
.dev-modal-bilingual{font-size:14px;line-height:1.7;color:var(--dim)}
.dev-modal-bilingual strong{color:var(--text);display:block;margin-bottom:4px}
.dev-modal-sep{border:none;border-top:1px solid var(--border);margin:14px 0}
@media(max-width:768px){
  main{padding:22px 14px 100px}
  .hero h1{font-size:30px}
  .hero{padding:44px 8px 10px}
  header{padding:8px 16px}
  .brand img{height:28px}
  .topnav{gap:5px}
  .btn-sm{padding:5px 10px;font-size:12px}
  .catalog-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
@media(max-width:480px){
  main{padding:16px 10px 90px}
  .hero h1{font-size:24px}
  .hero p{font-size:14px}
  .hero{padding:32px 6px 10px}
  .hero-btns{gap:8px}
  header{padding:6px 12px}
  .brand img{height:24px}
  .topnav{gap:3px}
  .lang-toggle button{padding:4px 7px;font-size:11px}
  .btn-sm{padding:5px 9px;font-size:12px}
  .card{padding:15px}
  .card+.card{margin-top:10px}
  h2{font-size:20px}
  h3{font-size:17px}
  .modal{padding:16px;margin:8px}
  .modal-btns{flex-direction:column-reverse;gap:6px}
  .catalog-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tabs{gap:0}
  .tab{padding:8px 10px;font-size:13px}
  footer{padding:16px 10px 50px}
  #ai-fab{bottom:16px;right:14px}
  .ai-circle-btn{width:52px;height:52px}
  .ai-label{font-size:14px}
  .info-row{flex-direction:column;gap:3px}
  .info-row .lbl{min-width:unset}
  #toasts{top:10px;right:10px;left:10px}
  .toast{max-width:100%}
  .scan-card{margin:16px auto}
  #cookie{padding:12px 14px;gap:10px}
  #cookie p{font-size:13px}
  .btn-row{flex-direction:column}
  .btn-row .btn{width:100%}
}
@media(min-width:1200px){
  main{padding:40px 28px 120px}
}
</style>
</head>
<body>
<div id="geo-loading">
  <div style="text-align:center">
    <img src="Praxifold.png" alt="Praxifold" style="height:52px;width:auto;margin:0 auto 18px;display:block">

  </div>
</div>
<div id="geo-block" class="hidden">
  <div>
    <img src="Praxifold.png" alt="Praxifold" style="height:56px;width:auto;margin:0 auto 20px;display:block">

      Ši paslauga prieinama tik Lietuvoje.<br>
      <small style="font-size:13px">This service is only available in Lithuania.</small>

</div>
<div id="maint" class="hidden">
  <div class="lang-toggle" id="maint-lang"></div>
  <div>
    <img src="Praxifold.png" alt="Praxifold" style="height:56px;width:auto;margin:0 auto 22px;display:block">
    <p id="maint-msg" style="color:#c8d8f0;font-size:17px;line-height:1.6;max-width:420px;font-family:'Segoe UI',system-ui,sans-serif"></p>
  </div>
</div>
<div id="dev-warn" class="hidden">Kūrėjų įrankiai yra užblokuoti. / Developer tools are blocked.</div>
<header>
  <div class="brand" onclick="navigate('landing')"><img src="Praxifold.png" alt="Praxifold"></div>
  <div class="topnav" id="nav"></div>
</header>
<main id="app"></main>
<footer>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSfBm7oA7_OsDzFm0fcYcIS47u1CxHvBDRCdMEw3IeYzRsCkrA/viewform?usp=header" target="_blank" rel="noopener" id="fl-report"></a>

</footer>
<div id="modal-root"></div>
<div id="cookie" class="hidden">
  <p id="ck-text"></p>
  <div class="ca">
    <button class="btn btn-ghost btn-sm" onclick="cookieChoose('necessary')" id="ck-nec"></button>
    <button class="btn btn-primary btn-sm" onclick="cookieChoose('all')" id="ck-all"></button>
  </div>
</div>
<div id="toasts"></div>
<div id="ai-fab">
  <div class="ai-info-btn" onmouseenter="showAiTip()" onmouseleave="hideAiTip()" onclick="toggleAiTip(event)">i
    <div class="ai-tooltip" id="ai-tt"></div>
  </div>
  <div class="ai-circle-btn" onclick="openAI()">
    <span class="ai-label">AI</span>
    <div class="ai-beta">Beta</div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
// >>> WEBSITE MAINTENANCE: set to true to show the maintenance screen on the MAIN site only.
// >>> Tag scanning pages (?key=...&tag_id=...) are never covered.
// >>> Press SPACE + Z + X together to bypass the screen (for this browser session) and test everything.
const MAINTENANCE_MODE = false;

const API_URL    = 'https://script.google.com/macros/s/AKfycbyNTxFqgFopvcxs94Urfr5WuzSUeloRkHtHYnDHoGHXjr6xLSSvMliqSwijTqhof-M/exec';
const POLICY_URL = 'https://praxifold.github.io/policy.txt';
const REPORT_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfBm7oA7_OsDzFm0fcYcIS47u1CxHvBDRCdMEw3IeYzRsCkrA/viewform?usp=header';
const ORIGIN     = 'https://praxifold.github.io';
const SESSION_TTL = 20*60*1000;
const TAG_CACHE_TTL = 24*60*60*1000;

const TR = {
lt:{
  login:'Prisijungti',register:'Registruotis',logout:'Atsijungti',
  catalog:'Parduotuvė',dashboard:'Skydelis',settings:'Nustatymai',

async function hmacHex(kh,msg){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(kh),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const s=await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ks(kh,nonce,len){
  const bytes=[]; let c=0;
  while(bytes.length<len){ const h=await hmacHex(kh,nonce+':'+c); for(let i=0;i<h.length;i+=2) bytes.push(parseInt(h.substr(i,2),16)); c++; }
  return bytes.slice(0,len);
}
function rndHex(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function encPay(kh,obj){
  const pt=Array.from(new TextEncoder().encode(JSON.stringify(obj)));
  const n=rndHex(16),k=await ks(kh,n,pt.length);
  const c=pt.map((b,i)=>(b^k[i]).toString(16).padStart(2,'0')).join('');
  return {n,c,t:await hmacHex(kh,n+':'+c)};
}
async function decPay(kh,enc){
  if(await hmacHex(kh,enc.n+':'+enc.c)!==enc.t) throw new Error('Integrity fail');
  const ct=[]; for(let i=0;i<enc.c.length;i+=2) ct.push(parseInt(enc.c.substr(i,2),16));
  const k=await ks(kh,enc.n,ct.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(ct.map((b,i)=>b^k[i]))));
}

    if(d.fullName!==undefined){this.fullName=d.fullName;LS.s('fn',d.fullName||'');}
    if(d.role!==undefined){this.role=d.role;LS.s('ro',d.role||'');}
    if(d.userId){this.userId=d.userId;LS.s('uid',d.userId);}
    LS.s('pxf_sexp',String(Date.now()+SESSION_TTL));
    this._expired=false;
    this._sched();
  },
  _sched(){ clearTimeout(this._t); this._t=setTimeout(()=>this._ref(), 18*60*1000); },
  async _ref(){
    if(!this.rt||!this.email) return;
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'refreshSession',payload:{refreshToken:this.rt,email:this.email},_origin:ORIGIN})});
      const raw=await r.json();
      let d=raw;
      if(raw.enc&&this.ek){ try{ const dec=await decPay(this.ek,raw.enc); d=Object.assign({},raw,dec); delete d.enc; }catch(_){} }
      if(d.success){this.save(d);}
      else if(d.code==='SESSION_REVOKED'||d.code==='SESSION_EXPIRED'){this.clear();navigate('login');toast(t('sessionExpired'),'error');}
      else{this._sched();}
    }catch(_){this._sched();}
  },
  clear(){
    clearTimeout(this._t);
    this.at=this.rt=this.ek=this.email=this.fullName=this.role=this.userId=null;
    ['at','rt','ek','em','fn','ro','uid','pxf_sexp'].forEach(k=>LS.r(k));
  },
  get ok(){
    if(!this.at||!this.rt) return false;
    const exp=Number(LS.g('pxf_sexp')||0);
    if(exp&&Date.now()>exp){
      this._expired=true;
      this.clear();
      return false;
    }
    return true;
  },
  get isAdmin(){ return this.role==='admin'||this.role==='developer'; },
  get isDev()  { return this.role==='developer'; }
};

const SENS_REQ = new Set(['email','key','tagId','token','setupToken','code','oldPassword','newPassword','adminPassword','targetEmail','deletionCode','refreshToken','password','alertEmail','streetAddress','additionalEmail']);
const SENS_FIELDS = new Set(['Alert Email','Street Address','Additional Email','Notes']);

const API={
  async call(action,payload,raw){
    payload=Object.assign({},payload||{});
    if(SM.at&&!raw){
      const exp=Number(LS.g('pxf_sexp')||0);
      if(exp&&Date.now()>exp){
        SM._expired=true; SM.clear(); navigate('login');
        toast(t('sessionExpired'),'error');
        return {success:false,code:'SESSION_EXPIRED',message:t('sessionExpired')};
      }
    }
    const body={action,_origin:ORIGIN};
    if(SM.ek&&SM.at&&!raw){
      body.tok=SM.at;
      const sensitive={},plain={};
      Object.keys(payload).forEach(k=>{
        if(k==='fields'){
          const hasSF=Object.keys(payload.fields||{}).some(f=>SENS_FIELDS.has(f));
          if(hasSF) sensitive.fields=payload.fields;
          else plain.fields=payload.fields;
        } else if(SENS_REQ.has(k)){
          sensitive[k]=payload[k];
        } else {
          plain[k]=payload[k];
        }
      });
      body.payload=plain;
      if(Object.keys(sensitive).length) body.enc=await encPay(SM.ek,sensitive);
    } else {
      if(SM.at) payload.accessToken=SM.at;
      body.payload=payload;
    }
    let data;
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      data=await r.json();
    }catch(_){return {success:false,code:'NETWORK',message:t('networkError')};}
    if(data.enc&&SM.ek){
      try{
        const dec=await decPay(SM.ek,data.enc);
        Object.assign(data,dec);
        delete data.enc;
      }catch(_){return {success:false,code:'DECRYPT',message:t('networkError')};}
    }
    if(data.code==='SESSION_EXPIRED'||data.code==='SESSION_REVOKED'){SM.clear();navigate('login');toast(t('sessionExpired'),'error');}
    return data;
  },
  async pub(params){
    const url=new URL(API_URL);
    Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));
    url.searchParams.set('_origin',ORIGIN);
    try{const r=await fetch(url);return await r.json();}
    catch(_){return {success:false,code:'NETWORK',message:t('networkError')};}
  }
};

const DevGuard={
  _clickTimes:[],
  getState(){ try{return JSON.parse(LS.g('pxf_devg')||'{}');}catch(_){return {};} },
  setState(s){ LS.s('pxf_devg',JSON.stringify(s)); },
  getMonthAttempts(s){
    const cutoff=Date.now()-30*24*60*60*1000;
    return (s.attempts||[]).filter(t=>t>cutoff);
  },
  getBotEvents(){
    const cutoff=Date.now()-30*24*60*60*1000;
    try{return (JSON.parse(LS.g('pxf_bev')||'[]')).filter(t=>t>cutoff);}catch(_){return[];}
  },
  recordBotEvent(){
    const evs=this.getBotEvents();
    evs.push(Date.now());
    LS.s('pxf_bev',JSON.stringify(evs));
    if(evs.length>=3&&SM.ok){
      this.addServerStrike('bot_detection');
      LS.s('pxf_bev',JSON.stringify([]));
    }
  },
  trackClick(){
    const now=Date.now();
    this._clickTimes.push(now);
    this._clickTimes=this._clickTimes.filter(t=>now-t<500);
    if(this._clickTimes.length>=8){ this.recordBotEvent(); this._clickTimes=[]; }
  },
  async addServerStrike(reason){
    try{
      const r=await API.call('addDevStrike',{reason});
      if(r&&r.banned){
        closeModal();
        modal(`<h3 style="color:var(--danger);margin-bottom:12px">⛔ ${esc(t('devWarn1Title'))}</h3>
          <p style="font-size:15px;line-height:1.7">${esc(t('devBanned'))}</p>
          <div class="modal-btns"><button class="btn btn-ghost btn-sm" onclick="closeModal()">${esc(t('close'))}</button></div>`,true);
        SM.clear(); return;
      }
    }catch(_){}
  },
  handle(){
    const s=this.getState();
    const atts=this.getMonthAttempts(s);
    const warned1=s.warned1||false;
    atts.push(Date.now());
    s.attempts=atts;
    const count=atts.length;
    if(count===1){
      if(!warned1){
        this.setState(s);
        modal(`<h3 style="margin-bottom:12px">⚠️ ${esc(t('devWarn1Title'))}</h3>
          <div class="dev-modal-bilingual">
            <strong>Lietuviškai</strong>
            Kūrėjų įrankių naudojimas yra draudžiamas ir prieštarauja mūsų politikai.
            <hr class="dev-modal-sep">
            <strong>English</strong>
            Developer tools are not permitted and are against our policy.
          </div>
          <div class="modal-btns">
            <button class="btn btn-primary" onclick="DevGuard.ack1()">Suprantu / I understand</button>
          </div>`,true);
      } else {
        this.setState(s);
        toast(t('devRepeat'),'error');
      }
    } else if(count===2){
      this.setState(s);
      modal(`<h3 style="margin-bottom:12px">⚠️ ${esc(t('devWarn2Title'))}</h3>
        <div class="dev-modal-bilingual">
          <strong>Lietuviškai</strong>
          Dar vienas pažeidimas gali lemti veiksmus prieš jūsų paskyrą.
          <hr class="dev-modal-sep">
          <strong>English</strong>
          Another offence may result in action against your account.
        </div>
        <div class="modal-btns"><button class="btn btn-ghost btn-sm" onclick="closeModal()">${esc(t('close'))}</button></div>`);
    } else {
      s.attempts=[];
      this.setState(s);
      toast(t('devWarn3Notice'),'error');
      if(SM.ok) this.addServerStrike('devtools');
    }
  },
  ack1(){
    const s=this.getState();
    s.warned1=true;
    this.setState(s);
    closeModal();
  }
};

async function renderCatalog(){
  const app=document.getElementById('app');
  app.innerHTML=`<h2 style="margin-bottom:16px">${t('catalog')}</h2>
    <div class="cat-ctrls">
      <input id="cs" placeholder="${t('search')}" oninput="filterCatalog()">
      <select id="cf" onchange="filterCatalog()">
        <option value="">${t('allTypes')}</option>
        <option value="Pet">${t('petType')}</option>
        <option value="Key">${t('keyType')}</option>
      </select>
    </div>
    <div id="cg" class="catalog-grid"><p class="muted">${t('loading')}</p></div>`;
  if(!State._stock){
    const r=await API.pub({action:'stock'});
    if(r&&r.success) State._stock=r.items||[]; else { document.getElementById('cg').innerHTML=`<p class="muted">${esc(em(r))}</p>`; return; }
  }
  filterCatalog();
}
function filterCatalog(){
  const s=(document.getElementById('cs')?.value||'').trim().toLowerCase(),f=document.getElementById('cf')?.value||'';
  const items=(State._stock||[]).filter(i=>{
    if(f&&nType(i['Type'])!==f) return false;
    if(!s) return true;
    const hay=[i['Name'],i['Material'],i['Color'],i['Model'],i['Technologies'],i['Description'],i['Product ID'],typeLbl(i['Type'])].map(v=>String(v===undefined||v===null?'':v).toLowerCase()).join(' ');
    return hay.includes(s);
  });
  State._shown=items;
  const g=document.getElementById('cg'); if(!g) return;
  if(!items.length){g.innerHTML=`<p class="muted">${t('noStock')}</p>`;return;}
  g.innerHTML=items.map((i,idx)=>`<div class="card pcard" onclick="openProduct(${idx})">
    <div class="pphoto"><img src="${esc(i['Product ID'])}.png" alt="${esc(i['Name'])}" onerror="this.style.display='none';this.parentElement.textContent='—'"></div>
    <div class="pbody">
      <h4>${esc(i['Name'])}</h4>
      <div class="muted">${esc(i['Material']||'')}${i['Color']?' · '+esc(i['Color']):''}</div>
      <div class="pprice">€${esc(i['Price'])}</div>
      <div class="muted" style="font-size:12px">${esc(i['Technologies']||'')} · ${esc(i['Model']||'')} · ${esc(typeLbl(i['Type']))}</div>
    </div>
  </div>`).join('');
}
function techHint(v){
  const s=String(v||'').toUpperCase().replace(/\s/g,'');
  if(s.includes('NFC')&&s.includes('QR')) return t('techBoth');
  if(s.includes('NFC')) return t('techNFC');
  if(s.includes('QR')) return t('techQR');
  return '';
}
function openProduct(idx){
  const p=State._shown[idx]; if(!p) return;
  const id=String(p['Product ID']||'');
  State._gal=[id+'.png']; State._galX={};
  const ty=nType(p['Type']);
  const hasStock=p['Stock Quantity']!==undefined&&p['Stock Quantity']!==null&&String(p['Stock Quantity'])!=='';
  const rows=[
    [t('type'),typeLbl(p['Type']),ty==='Key'?t('typeKeyHint'):t('typePetHint')],
    [t('material'),p['Material'],''],
    [t('color'),p['Color'],''],
    [t('price'),p['Price']!==undefined&&p['Price']!==''?'€'+p['Price']:'',''],
    [t('technologies'),p['Technologies'],techHint(p['Technologies'])],
    [t('model'),p['Model'],p['Model']==='Pro'?t('modelPro'):(p['Model']==='Base'?t('modelBase'):'')],
    [t('description'),p['Description'],''],
    hasStock?[t('availability'),Number(p['Stock Quantity'])>0?t('inStock'):t('outStock'),'']:null,
  ].filter(r=>r&&r[1]!==undefined&&r[1]!==null&&String(r[1])!=='');
  modal(`<h3>${esc(p['Name'])}</h3>
    <div class="gal-main"><img id="gal-main" src="${esc(id)}.png" alt="${esc(p['Name'])}" onerror="this.style.display='none'"></div>
    <div id="gal-th" class="gal-th"></div>
    <div style="margin-top:14px">${rows.map(r=>`<div class="info-row"><span class="lbl">${esc(r[0])}</span><span class="val">${esc(r[1])}${r[2]?`<span class="hint">${esc(r[2])}</span>`:''}</span></div>`).join('')}</div>
    <div class="modal-btns"><button class="btn btn-ghost btn-sm" onclick="closeModal()">${t('close')}</button></div>`,false,true);
  [2,3].forEach(n=>{
    const src=id+'_'+n+'.png'; const im=new Image();
    im.onload=()=>{ State._galX[n]=src; State._gal=[id+'.png'].concat([2,3].filter(k=>State._galX[k]).map(k=>State._galX[k])); galThumbs(); };
    im.src=src;
  });
}
function galThumbs(){
  const th=document.getElementById('gal-th'); if(!th) return;
  if(State._gal.length<2){th.innerHTML='';return;}
  th.innerHTML=State._gal.map((s,i)=>`<img src="${esc(s)}" class="${i===0?'on':''}" onclick="setGal(${i})" alt="">`).join('');
}
function setGal(i){
  const m=document.getElementById('gal-main'); if(!m) return;
  m.style.display='block'; m.src=State._gal[i];
  document.querySelectorAll('#gal-th img').forEach((el,k)=>el.classList.toggle('on',k===i));
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const el=document.getElementById('tc');
  if(tab==='tags')     el.innerHTML=renderTagsTab();
  if(tab==='admin')    el.innerHTML=renderAdminTab();
  if(tab==='dev')      renderDevTab(el);
  if(tab==='settings') el.innerHTML=renderSettingsTab();
}

function sPill(s){
  if(s==='Active') return `<span class="pill active">${t('statusActive')}</span>`;
  if(s==='Pending Activation') return `<span class="pill pending">${t('statusPending')}</span>`;
  if(s==='Lost/Stolen') return `<span class="pill lost">${t('statusLost')}</span>`;
  return `<span class="pill">${t('statusUnreg')}</span>`;
}

async function toggleSafeModeUI(e,tagId){
  const cb=e.target;
  if(getSmCooldown(tagId)){cb.checked=!cb.checked;toast(t('smCooldown'),'info');return;}
  cb.disabled=true;
  const r=await API.call('toggleSafeMode',{tagId,safeMode:cb.checked});
  cb.disabled=false;
  if(!r.success){cb.checked=!cb.checked;toast(em(r),'error');}
  else setSmCooldown(tagId);
}

async function submitEditTag(tagId,form){
  const isPro=(State._dash&&State._dash.tags||[]).find(x=>x['Tag ID']===tagId)?.['Model']==='Pro';
  if(isPro){
    const coolExp=getEditCooldown(tagId);
    if(coolExp){const mins=Math.ceil((coolExp-Date.now())/60000);showAlert('tag-alert-'+tagId,t('editCooldownLocal').replace('%m',mins));return;}
  }
  const fields={};
  form.querySelectorAll('input[name],textarea[name]').forEach(el=>{ fields[el.name]=el.value; });
  const r=await API.call('editTag',{tagId,fields});
  if(r.success){
    showAlert('tag-alert-'+tagId,t('saved'),'ok');
    if(isPro) setEditCooldown(tagId);
  } else {
    showAlert('tag-alert-'+tagId,em(r));
    if(r.code==='COOLDOWN'&&isPro) setEditCooldown(tagId);
  }
}

/* ================= TAG SCAN PAGE (+24h cache) ================= */
function cacheTag(tagId,key,res){
  const k='pxf_tc_'+tagId, tg=res&&res.success&&res.tag;
  if(tg&&tg.registered&&tg.status==='Active'&&!tg.safeMode&&!tg.lost){
    LS.s(k,JSON.stringify({t:Date.now(),k:key,res}));
  } else { LS.r(k); }
}
async function refreshTag(){
  const p=State._tagParams; if(!p) return;
  const res=await API.pub({key:p.key,tag_id:p.tagId});
  if(res&&res.success===false&&res.code==='NETWORK'){toast(em(res),'error');return;}
  State._tagResult=res; State._cachedAt=null;
  cacheTag(p.tagId,p.key,res);
  render();
}

/* ================= INIT ================= */
async function startMain(){
  const params=new URLSearchParams(window.location.search);
  const resetTok=params.get('reset'),setupTok=params.get('setup'),uid=params.get('uid');
  const key=params.get('key'),tagId=params.get('tag_id'),isAct=params.get('activation')==='1';

  if(resetTok&&uid){hideLoadingScreen();State._resetParams={token:resetTok,uid};State.view='resetForm';render();return;}
  if(setupTok&&uid){hideLoadingScreen();State._setupParams={token:setupTok,uid};State.view='setup';render();return;}

  if(SM._expired&&!(key&&tagId)){
    hideLoadingScreen();
    State.view='login';
    render();
    setTimeout(()=>toast(t('sessionExpired'),'error'),200);
    return;
  }

  if(key&&tagId){
    State._tagParams={key,tagId};
    // 24h cache of owner details (never cached when safe mode is on)
    if(!isAct){
      let c=null; try{c=JSON.parse(LS.g('pxf_tc_'+tagId)||'null');}catch(_){}
      if(c){
        if(Date.now()-c.t>TAG_CACHE_TTL){ LS.r('pxf_tc_'+tagId); window.location.replace(ORIGIN+'/'); return; }
        if(c.k===key&&c.res){
          State._tagResult=c.res; State._cachedAt=c.t; State.view='tagScan';
          hideLoadingScreen(); render(); return;
        }
        LS.r('pxf_tc_'+tagId);
      }
    }
    const ldMsg=document.getElementById('ld-msg');
    if(ldMsg){ldMsg.style.opacity='0';setTimeout(()=>{ldMsg.textContent=L==='lt'?'Kraunama...':'Loading...';ldMsg.style.opacity='1';},280);}
    const res=await API.pub({key,tag_id:tagId});
    State._tagResult=res; State._cachedAt=null;
    if(!isAct) cacheTag(tagId,key,res);
    State.view=(res.success&&res.tag&&res.tag.status==='Pending Activation')||isAct?'activation':'tagScan';
    hideLoadingScreen();
    render(); return;
  }

  hideLoadingScreen();
  State.view=SM.ok?'dashboard':'landing';
  render();
}

async function init(){
  initDevBlock();
  const allowed=await checkGeoOnly();
  if(!allowed){
    const el=document.getElementById('geo-loading');
    el.style.opacity='0';
    setTimeout(()=>{el.classList.add('hidden');document.getElementById('geo-block').classList.remove('hidden');},360);
    return;
  }
  initCookies();
  SM.load();
  const q=new URLSearchParams(window.location.search);
  const isTagPage=!!(q.get('key')&&q.get('tag_id'));
  if(MAINTENANCE_MODE&&!isTagPage&&!maintBypassed()){
    hideLoadingScreen();
    showMaint();
    initMaintKeys(()=>startMain());
    return;
  }
  startMain();
}
init();
</script>
</body>
</html>
