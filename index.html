<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxifold</title>
<style>
  :root {
    --bg: #0e1a1a;
    --bg-panel: #142524;
    --bg-panel-2: #1b312f;
    --border: #26433f;
    --text: #eaf2ef;
    --text-dim: #9db3ae;
    --accent: #e8a33d;
    --accent-dim: #b9812c;
    --danger: #d9534f;
    --success: #4caf7d;
    --radius: 10px;
    --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; }
  .hidden { display: none !important; }
  .muted { color: var(--text-dim); }
  .help-text { font-size: 12px; color: var(--text-dim); margin: -8px 0 12px; }

  /* ---------- Layout shell ---------- */
  header.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,26,26,0.92);
    backdrop-filter: blur(6px);
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
  .brand .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #f2c374);
    display: inline-block;
  }
  nav.topnav { display: flex; gap: 10px; align-items: center; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

  .btn {
    border: none; border-radius: var(--radius);
    padding: 11px 20px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #14201a; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-small { padding: 7px 14px; font-size: 13px; }
  .btn-block { width: 100%; }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0; font-size: 13px; color: var(--text-dim); }
  .checkbox-row input { width: auto; margin: 3px 0 0; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-child { border-bottom: none; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; margin: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }

  /* ---------- Landing ---------- */
  .hero { text-align: center; padding: 60px 10px 20px; }
  .hero h1 { font-size: 40px; margin-bottom: 8px; }
  .hero p { color: var(--text-dim); font-size: 16px; margin-bottom: 28px; }
  .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .subtext-link { display: block; margin-top: 18px; font-size: 14px; color: var(--text-dim); cursor: pointer; text-decoration: underline; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-box {
    background: var(--bg-panel-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px; max-width: 460px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-box.wide { max-width: 620px; }
  .modal-box h3 { margin-top: 0; }
  .modal-box p { font-size: 14px; line-height: 1.55; color: var(--text-dim); }
  .modal-close-row { text-align: right; margin-top: 18px; }

  /* ---------- Cookie banner ---------- */
  #cookie-banner {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-panel-2); border-top: 1px solid var(--border);
    padding: 16px 20px; display: flex; gap: 16px; align-items: center;
    justify-content: space-between; flex-wrap: wrap; z-index: 90;
  }
  #cookie-banner p { margin: 0; font-size: 14px; color: var(--text-dim); max-width: 560px; }
  .cookie-actions { display: flex; gap: 10px; }

  /* ---------- Catalog ---------- */
  .catalog-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .catalog-controls input { margin-bottom: 0; flex: 1; min-width: 180px; }
  .catalog-controls select { margin-bottom: 0; width: auto; }
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .product-card { overflow: hidden; padding: 0; }
  .product-photo { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; overflow: hidden; }
  .product-photo img { width: 100%; height: 100%; object-fit: cover; }
  .product-body { padding: 14px; }
  .product-body h4 { margin: 0 0 4px; font-size: 15px; }
  .product-price { color: var(--accent); font-weight: 700; margin: 4px 0; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg-panel-2); border: 1px solid var(--border); color: var(--text-dim); margin-top: 6px; }

  /* ---------- Dashboard ---------- */
  .dash-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 6px; margin: 18px 0 22px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tag-card { margin-bottom: 14px; }
  .tag-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .tag-id-pill { font-size: 12px; color: var(--text-dim); font-family: monospace; }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 16px 0 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

  .alert-box { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .alert-error { background: rgba(217,83,79,0.15); border: 1px solid var(--danger); color: #f3aeac; }
  .alert-success { background: rgba(76,175,125,0.15); border: 1px solid var(--success); color: #a6e2c2; }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.admin-table th, table.admin-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; white-space: nowrap; }
  .admin-table-wrap { overflow-x: auto; }
  footer.sitefooter { text-align: center; padding: 30px 20px 90px; color: var(--text-dim); font-size: 13px; }
  footer.sitefooter a { margin: 0 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span> Praxifold</div>
  <nav class="topnav" id="topnav"></nav>
</header>

<main id="app"></main>

<footer class="sitefooter" id="site-footer"></footer>

<div id="modal-root"></div>
<div id="cookie-banner" class="hidden">
  <p>Naudojame slapukus, kad svetainė veiktų tinkamai ir galėtume prisiminti jūsų nustatymus.</p>
  <div class="cookie-actions">
    <button class="btn btn-ghost btn-small" onclick="Cookies.choose('necessary')">Tik būtini</button>
    <button class="btn btn-primary btn-small" onclick="Cookies.choose('all')">Sutikti su visais</button>
  </div>
</div>

<script>
/* ============================================================
   PRAXIFOLD — Frontend
   Single-page app. All UI text in Lithuanian.
   ============================================================ */

// ---- CONFIGURE THIS: your deployed Apps Script Web App URL ----
const API_URL = 'https://script.google.com/macros/s/AKfycbyBmI9qgbpPElarfiuE-9XzoKtg7v7FNMelskCSYHkjUPbSzc6XX0SYw-KV52biS_QL/exec';

const PRIVACY_POLICY_TEXT = `
<p><strong>1. Kokius duomenis renkame.</strong> Kuriant paskyrą saugome jūsų vardą, pavardę ir el. paštą.
Slaptažodis niekada nesaugomas atviru tekstu — saugomas tik jo kriptografinis, druskuotas maišos (hash) rezultatas.
Priregistravę pakabuką, taip pat saugome jūsų augintinio ar rakto duomenis (pvz., vardą, kontaktinį el. paštą),
kuriuos patys nurodote.</p>
<p><strong>2. Kam naudojame duomenis.</strong> Duomenys naudojami tik tam, kad veiktų paskyra, pakabukų registracija
ir automatiniai įspėjimai nuskaičius pakabuką. Duomenų neparduodame ir neperduodame trečiosioms šalims.</p>
<p><strong>3. Saugumas.</strong> Slaptažodžiai saugomi su druska ir kartotine maišos funkcija. Prisijungimo sesijos
naudoja kriptografiškai pasirašytus žetonus (tokens). Po kelių nesėkmingų prisijungimo bandymų paskyra laikinai arba
visam laikui užrakinama.</p>
<p><strong>4. Jūsų teisės.</strong> Galite bet kada paprašyti ištrinti savo paskyrą nustatymuose. Prašymas
perduodamas administratoriui apdorojimui.</p>
<p><strong>5. Slapukai.</strong> Naudojame būtinuosius slapukus svetainės veikimui ir, jei sutinkate, papildomus
slapukus jūsų nustatymams prisiminti.</p>
<p><strong>6. Kontaktai.</strong> Klausimais dėl duomenų kreipkitės el. paštu pasaulinukai@protonmail.com.</p>
`;

// ============================================================
// API layer — POST as text/plain to avoid CORS preflight
// ============================================================
const Api = {
  async call(action, payload) {
    payload = payload || {};
    if (State.sessionToken) payload.sessionToken = State.sessionToken;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload })
    });
    if (!res.ok) return { success: false, code: 'NETWORK', message: 'Nepavyko pasiekti serverio.' };
    try { return await res.json(); }
    catch (e) { return { success: false, code: 'PARSE', message: 'Neteisingas serverio atsakymas.' }; }
  },
  async getPublic(params) {
    const url = new URL(API_URL);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    const res = await fetch(url.toString());
    try { return await res.json(); }
    catch (e) { return { success: false, code: 'PARSE', message: 'Neteisingas serverio atsakymas.' }; }
  }
};

// ============================================================
// State + persistence
// ============================================================
const State = {
  sessionToken: localStorage.getItem('praxifold_session') || null,
  fullName: localStorage.getItem('praxifold_name') || null,
  role: localStorage.getItem('praxifold_role') || '',
  email: localStorage.getItem('praxifold_email') || null,
  view: 'landing'
};

function setSession(token, fullName, role, email) {
  State.sessionToken = token; State.fullName = fullName; State.role = role; State.email = email;
  localStorage.setItem('praxifold_session', token || '');
  localStorage.setItem('praxifold_name', fullName || '');
  localStorage.setItem('praxifold_role', role || '');
  localStorage.setItem('praxifold_email', email || '');
}
function clearSession() {
  State.sessionToken = null; State.fullName = null; State.role = ''; State.email = null;
  localStorage.removeItem('praxifold_session');
  localStorage.removeItem('praxifold_name');
  localStorage.removeItem('praxifold_role');
  localStorage.removeItem('praxifold_email');
}

function roleLabel(role) {
  if (role === 'developer') return 'Kūrėjas (administratorius)';
  if (role === 'praxifold team') return 'Komandos narys';
  return 'Klientas';
}

// ============================================================
// Cookie consent banner
// ============================================================
const Cookies = {
  init() {
    if (!localStorage.getItem('praxifold_cookie_choice')) {
      document.getElementById('cookie-banner').classList.remove('hidden');
    }
  },
  choose(mode) {
    localStorage.setItem('praxifold_cookie_choice', mode);
    document.getElementById('cookie-banner').classList.add('hidden');
  }
};

// ============================================================
// Modal helper
// ============================================================
function showModal(innerHtml, wide) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box${wide ? ' wide' : ''}">${innerHtml}
      <div class="modal-close-row"><button class="btn btn-ghost btn-small" onclick="closeModal()">Uždaryti</button></div>
    </div>
  </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openPolicyModal(ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  showModal(`<h3>Privatumo politika ir taisyklės</h3>${PRIVACY_POLICY_TEXT}`, true);
}

// ============================================================
// Router / render
// ============================================================
function navigate(view) { State.view = view; render(); }

function render() {
  renderNav();
  renderFooter();
  const app = document.getElementById('app');
  switch (State.view) {
    case 'landing': return app.innerHTML = viewLanding();
    case 'register': return app.innerHTML = viewRegister();
    case 'login': return app.innerHTML = viewLogin();
    case 'catalog': return renderCatalogView();
    case 'dashboard': return renderDashboardView();
    case 'tagResult': return app.innerHTML = viewTagResult(State._tagResult);
    default: return app.innerHTML = viewLanding();
  }
}

function renderNav() {
  const nav = document.getElementById('topnav');
  if (State.sessionToken) {
    nav.innerHTML = `
      <button class="btn btn-ghost btn-small" onclick="navigate('catalog')">Parduotuvė</button>
      <button class="btn btn-ghost btn-small" onclick="navigate('dashboard')">Skydelis</button>
      <button class="btn btn-primary btn-small" onclick="doLogout()">Atsijungti</button>`;
  } else {
    nav.innerHTML = `
      <button class="btn btn-ghost btn-small" onclick="navigate('catalog')">Parduotuvė</button>
      <button class="btn btn-ghost btn-small" onclick="navigate('login')">Prisijungti</button>
      <button class="btn btn-primary btn-small" onclick="navigate('register')">Sukurti paskyrą</button>`;
  }
}

function renderFooter() {
  document.getElementById('site-footer').innerHTML = `
    <div><a href="https://www.google.com" target="_blank" rel="noopener">Pranešti apie klaidą</a></div>
    <div style="margin-top:10px;">Visos teisės saugomos.</div>`;
}

function doLogout() { clearSession(); navigate('landing'); }

// ============================================================
// VIEW: Landing
// ============================================================
function viewLanding() {
  return `
    <div class="hero">
      <h1>Sveiki, kaip galime padėti?</h1>
      <p>Praxifold — saugūs NFC/QR pakabukai jūsų augintiniams ir raktams.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="navigate('register')">Sukurti paskyrą</button>
        <button class="btn btn-ghost" onclick="navigate('login')">Prisijungti</button>
      </div>
      <span class="subtext-link" onclick="openGetTagModal()">Neturite pakabuko? Spustelėkite čia, kad sužinotumėte, kaip jį gauti</span>
    </div>`;
}

function openGetTagModal() {
  showModal(`<h3>Kaip įsigyti pakabuką?</h3>
    <p>Prašome rašyti el. paštu <strong>pasaulinukai@protonmail.com</strong> arba įsigyti mūsų stende JA renginių metu.</p>`);
}

// ============================================================
// VIEW: Register / Login
// ============================================================
function viewRegister() {
  return `
    <div class="card" style="max-width:420px;margin:0 auto;">
      <h2>Sukurti paskyrą</h2>
      <div id="register-alert"></div>
      <form onsubmit="return submitRegister(event)">
        <div class="field"><label>Vardas ir pavardė</label><input id="reg-name" required></div>
        <div class="field"><label>El. paštas</label><input id="reg-email" type="email" required></div>
        <div class="field">
          <label>Slaptažodis</label>
          <input id="reg-password" type="password" minlength="10" required>
        </div>
        <p class="help-text">Bent 10 simbolių: didžioji raidė, mažoji raidė ir skaičius.</p>
        <div class="checkbox-row">
          <input type="checkbox" id="reg-policy" required>
          <label for="reg-policy" style="margin:0;">Sutinku su <a href="#" onclick="openPolicyModal(event)">Privatumo politika ir taisyklėmis</a></label>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sukurti paskyrą</button>
      </form>
      <p style="margin-top:14px;font-size:14px;color:var(--text-dim);">Jau turite paskyrą? <a href="#" onclick="navigate('login');return false;">Prisijunkite</a></p>
    </div>`;
}

async function submitRegister(ev) {
  ev.preventDefault();
  const fullName = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const policyAccepted = document.getElementById('reg-policy').checked;
  const alertEl = document.getElementById('register-alert');
  alertEl.innerHTML = '';

  if (!policyAccepted) {
    alertEl.innerHTML = `<div class="alert-box alert-error">Turite sutikti su Privatumo politika ir taisyklėmis.</div>`;
    return false;
  }
  const strongEnough = password.length >= 10 && /[a-z]/.test(password) && /[A-Z]/.test(password) && /[0-9]/.test(password);
  if (!strongEnough) {
    alertEl.innerHTML = `<div class="alert-box alert-error">Slaptažodis turi būti bent 10 simbolių ir turėti didžiąją raidę, mažąją raidę bei skaičių.</div>`;
    return false;
  }

  const res = await Api.call('register', { fullName, email, password, policyAccepted });
  if (!res.success) {
    alertEl.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`;
    return false;
  }
  setSession(res.sessionToken, res.fullName, res.role, email);
  navigate('dashboard');
  return false;
}

function viewLogin() {
  return `
    <div class="card" style="max-width:420px;margin:0 auto;">
      <h2>Prisijungti</h2>
      <div id="login-alert"></div>
      <form onsubmit="return submitLogin(event)">
        <div class="field"><label>El. paštas</label><input id="login-email" type="email" required></div>
        <div class="field"><label>Slaptažodis</label><input id="login-password" type="password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Prisijungti</button>
      </form>
      <p style="margin-top:14px;font-size:14px;color:var(--text-dim);">Neturite paskyros? <a href="#" onclick="navigate('register');return false;">Registruokitės</a></p>
    </div>`;
}

async function submitLogin(ev) {
  ev.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const alertEl = document.getElementById('login-alert');
  alertEl.innerHTML = '';

  const res = await Api.call('login', { email, password });
  if (!res.success) {
    alertEl.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`;
    return false;
  }
  setSession(res.sessionToken, res.fullName, res.role, email);
  navigate('dashboard');
  return false;
}

// ============================================================
// VIEW: Catalog
// ============================================================
async function renderCatalogView() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <h2>Parduotuvė</h2>
    <div class="catalog-controls">
      <input id="catalog-search" placeholder="Ieškoti prekių..." oninput="filterCatalog()">
      <select id="catalog-filter" onchange="filterCatalog()">
        <option value="">Visos kategorijos</option>
        <option value="Pet">Augintinis</option>
        <option value="Key">Raktas</option>
      </select>
    </div>
    <div id="catalog-grid" class="catalog-grid"><p class="muted">Kraunama...</p></div>`;

  const res = await Api.getPublic({ action: 'getStock' });
  State._stock = res.success ? res.items : [];
  filterCatalog();
}

function filterCatalog() {
  const search = (document.getElementById('catalog-search')?.value || '').toLowerCase();
  const type = document.getElementById('catalog-filter')?.value || '';
  const items = (State._stock || []).filter(item => {
    const matchesSearch = String(item['Item Name']).toLowerCase().includes(search);
    const matchesType = !type || item['Type'] === type;
    return matchesSearch && matchesType;
  });

  const grid = document.getElementById('catalog-grid');
  if (!items.length) { grid.innerHTML = '<p class="muted">Prekių nerasta.</p>'; return; }

  grid.innerHTML = items.map(item => `
    <div class="card product-card">
      <div class="product-photo">
        <img src="${item['Tag ID']}.png" alt="${escapeHtml(item['Item Name'])}"
             onerror="this.style.display='none';this.parentElement.textContent='Nėra nuotraukos';">
      </div>
      <div class="product-body">
        <h4>${escapeHtml(item['Item Name'])}</h4>
        <div style="font-size:13px;color:var(--text-dim);">${escapeHtml(item['Material'] || '')}</div>
        <div class="product-price">€${escapeHtml(String(item['Price'] ?? ''))}</div>
        <div style="font-size:12px;color:var(--text-dim);">Sandėlyje: ${escapeHtml(String(item['Stock Quantity'] ?? ''))}</div>
        <span class="badge">${escapeHtml(item['Technologies Used'] || '')}</span>
      </div>
    </div>`).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// VIEW: Dashboard (role-aware, tabbed, plain-language)
// ============================================================
async function renderDashboardView() {
  const app = document.getElementById('app');
  app.innerHTML = `<p class="muted">Kraunama...</p>`;
  const res = await Api.call('getUserData', {});
  if (!res.success) {
    if (res.code === 'FORBIDDEN' || (res.message && res.message.includes('Sesij'))) { clearSession(); navigate('login'); return; }
    app.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`;
    return;
  }

  State._dashboard = res;
  let tabs = `<button class="tab-btn active" data-tab="tags" onclick="switchDashboardTab('tags')">Mano pakabukai</button>`;
  if (res.role === 'praxifold team' || res.role === 'developer') {
    tabs += `<button class="tab-btn" data-tab="team" onclick="switchDashboardTab('team')">Naujo pakabuko kūrimas</button>`;
  }
  if (res.role === 'developer') {
    tabs += `<button class="tab-btn" data-tab="admin" onclick="switchDashboardTab('admin')">Administravimas</button>`;
  }
  tabs += `<button class="tab-btn" data-tab="settings" onclick="switchDashboardTab('settings')">Nustatymai</button>`;

  app.innerHTML = `
    <div class="dash-header">
      <h2 style="margin-bottom:0;">Sveiki, ${escapeHtml(res.fullName)}</h2>
      <span class="badge">${escapeHtml(roleLabel(res.role))}</span>
    </div>
    <div class="tabs">${tabs}</div>
    <div id="dashboard-tab-content"></div>`;
  switchDashboardTab('tags');
}

function switchDashboardTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const el = document.getElementById('dashboard-tab-content');
  if (tab === 'tags') return el.innerHTML = renderMyTags();
  if (tab === 'team') return el.innerHTML = renderTeamTools();
  if (tab === 'admin') return renderAdminPanel(el);
  if (tab === 'settings') return el.innerHTML = renderSettingsTab();
}

function renderMyTags() {
  const tags = State._dashboard.tags || [];
  if (!tags.length) {
    return `<div class="card"><p class="muted" style="margin:0;">Kol kas neturite priregistruotų pakabukų.
      Atidarykite pakabuko nuorodą (esančią ant paties pakabuko), prisijungę prie savo paskyros,
      ir jis automatiškai pasiūlys jį priregistruoti.</p></div>`;
  }
  return tags.map(t => `
    <div class="card tag-card">
      <div class="tag-card-head">
        <div><strong>${escapeHtml(t['Pet Name'] || t['Tag ID'])}</strong> <span class="tag-id-pill">${escapeHtml(t['Tag ID'])}</span></div>
        <span class="badge">${escapeHtml(t['Model Type'])}</span>
      </div>
      <form onsubmit="return submitEditTag(event,'${t['Tag ID']}')">
        <div class="section-label">Pagrindiniai duomenys</div>
        <div class="grid-2">
          <div class="field"><label>Augintinio vardas</label><input name="Pet Name" value="${escapeHtml(t['Pet Name']||'')}"></div>
          <div class="field"><label>Savininko vardas</label><input name="Owner First Name" value="${escapeHtml(t['Owner First Name']||'')}"></div>
          <div class="field"><label>Kontaktinis el. paštas</label><input name="Contact Email" type="email" value="${escapeHtml(t['Contact Email']||'')}"></div>
          <div class="field"><label>Įspėjimų el. paštas</label><input name="Alert Notification Email" type="email" value="${escapeHtml(t['Alert Notification Email']||'')}"></div>
        </div>
        <div class="toggle-row">
          <span>Augintinis saugus namuose</span>
          <label class="switch"><input type="checkbox" name="Safe Mode Status" ${t['Safe Mode Status']?'checked':''}><span class="slider"></span></label>
        </div>
        ${t['Model Type']==='Pro' ? `
        <div class="section-label">Papildomi Pro duomenys</div>
        <div class="grid-2">
          <div class="field"><label>Gatvė</label><input name="Street Name" value="${escapeHtml(t['Street Name']||'')}"></div>
          <div class="field"><label>Papildomas el. paštas</label><input name="Additional Email" type="email" value="${escapeHtml(t['Additional Email']||'')}"></div>
          <div class="field"><label>Susitikimo vieta</label><input name="Nearby Meeting Place" value="${escapeHtml(t['Nearby Meeting Place']||'')}"></div>
          <div class="field"><label>Veterinaro duomenys</label><input name="Vet Details" value="${escapeHtml(t['Vet Details']||'')}"></div>
          <div class="field"><label>Alergijos</label><input name="Allergies" value="${escapeHtml(t['Allergies']||'')}"></div>
          <div class="field"><label>Amžius</label><input name="Age" value="${escapeHtml(String(t['Age']||''))}"></div>
        </div>
        <div class="toggle-row">
          <span>Turi mikroschemą</span>
          <label class="switch"><input type="checkbox" name="Microchip Status" ${t['Microchip Status']?'checked':''}><span class="slider"></span></label>
        </div>
        <p class="help-text" style="margin-top:10px;">Pro pakabukams galioja 1 valandos pertrauka tarp pakeitimų.</p>
        ` : ''}
        <div id="tag-alert-${t['Tag ID']}"></div>
        <button class="btn btn-primary" type="submit" style="margin-top:10px;">Išsaugoti pakeitimus</button>
      </form>
    </div>`).join('');
}

async function submitEditTag(ev, tagId) {
  ev.preventDefault();
  const form = ev.target;
  const fields = {};
  form.querySelectorAll('input[name]').forEach(input => {
    fields[input.name] = input.type === 'checkbox' ? input.checked : input.value;
  });
  const res = await Api.call('editTag', { tagId, fields });
  const alertEl = document.getElementById('tag-alert-' + tagId);
  alertEl.innerHTML = res.success
    ? `<div class="alert-box alert-success">Išsaugota.</div>`
    : `<div class="alert-box alert-error">${res.message}</div>`;
  return false;
}

function renderTeamTools() {
  return `
    <div class="card" style="max-width:480px;">
      <h3>Generuoti naują pakabuką</h3>
      <div class="field"><label>Modelis</label>
        <select id="gen-model"><option value="Base">Base</option><option value="Pro">Pro</option></select>
      </div>
      <div class="field"><label>Jūsų GitHub Pages vartotojo vardas</label><input id="gen-username" placeholder="pvz. praxifold"></div>
      <button class="btn btn-primary" onclick="submitGenerateTag()">Generuoti</button>
      <div id="gen-result" style="margin-top:14px;"></div>
    </div>`;
}

async function submitGenerateTag() {
  const modelType = document.getElementById('gen-model').value;
  const githubUsername = document.getElementById('gen-username').value.trim();
  const res = await Api.call('generateTag', { modelType, githubUsername });
  const el = document.getElementById('gen-result');
  if (!res.success) { el.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`; return; }
  el.innerHTML = `
    <div class="alert-box alert-success">Pakabukas sukurtas: ${res.tagId}</div>
    <label>Nuoroda</label>
    <input readonly value="${res.url}" onclick="this.select()">`;
}

// ---- Developer admin panel ----
async function renderAdminPanel(el) {
  el.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-ghost btn-small" onclick="loadAdminSheet('Users')">Vartotojai</button>
      <button class="btn btn-ghost btn-small" onclick="loadAdminSheet('Tags')">Pakabukai</button>
      <button class="btn btn-ghost btn-small" onclick="loadAdminSheet('Stock')">Prekės</button>
    </div>
    <div id="admin-sheet-content" class="admin-table-wrap"></div>`;
  loadAdminSheet('Users');
}

async function loadAdminSheet(sheetName) {
  const content = document.getElementById('admin-sheet-content');
  content.innerHTML = 'Kraunama...';
  const res = await Api.call('adminGetSheet', { sheetName });
  if (!res.success) { content.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`; return; }

  const cols = res.columns;
  const rows = res.rows;
  content.innerHTML = `<table class="admin-table"><thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}<th>Veiksmai</th></tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c=>`<td>${escapeHtml(String(r[c] ?? ''))}</td>`).join('')}
      <td><button class="btn btn-danger btn-small" onclick="adminDeleteRow('${sheetName}',${r._row})">Ištrinti</button></td></tr>`).join('')}
    </tbody></table>`;
}

async function adminDeleteRow(sheetName, row) {
  if (!confirm('Ar tikrai norite ištrinti šį įrašą?')) return;
  const res = await Api.call('adminDeleteRecord', { sheetName, row });
  if (res.success) loadAdminSheet(sheetName);
  else alert(res.message);
}

// ---- Settings tab ----
function renderSettingsTab() {
  return `
    <div class="card" style="max-width:480px;">
      <h3>Paskyros informacija</h3>
      <p style="margin:0 0 4px;"><strong>El. paštas:</strong> ${escapeHtml(State._dashboard.email || '')}</p>
      <p style="margin:0;"><strong>Rolė:</strong> ${escapeHtml(roleLabel(State._dashboard.role))}</p>

      <hr style="border-color:var(--border);margin:20px 0;">
      <h3>Privatumas</h3>
      <button class="btn btn-ghost" onclick="openPolicyModal()">Peržiūrėti privatumo politiką ir taisykles</button>

      <hr style="border-color:var(--border);margin:20px 0;">
      <h3 style="color:var(--danger);">Pavojinga zona</h3>
      <p class="muted" style="margin-top:0;">Paskyros ištrynimas yra negrįžtamas veiksmas.</p>
      <button class="btn btn-danger" onclick="openDeleteAccountModal()">Ištrinti paskyrą</button>
    </div>`;
}

// ============================================================
// Account deletion modal
// ============================================================
function openDeleteAccountModal() {
  showModal(`
    <h3>Ištrinti paskyrą</h3>
    <p>Įveskite slaptažodį, kad patvirtintumėte paskyros ištrynimo prašymą.</p>
    <div id="delete-account-alert"></div>
    <div class="field"><input id="delete-account-password" type="password" placeholder="Slaptažodis"></div>
    <button class="btn btn-danger btn-block" onclick="submitDeleteAccount()">Patvirtinti ištrynimą</button>`);
}

async function submitDeleteAccount() {
  const password = document.getElementById('delete-account-password').value;
  const res = await Api.call('deleteAccountRequest', { password });
  const alertEl = document.getElementById('delete-account-alert');
  if (!res.success) { alertEl.innerHTML = `<div class="alert-box alert-error">${res.message}</div>`; return; }
  alertEl.innerHTML = `<div class="alert-box alert-success">Prašymas priimtas. Administratorius jį apdoros netrukus.</div>`;
}

// ============================================================
// Tag scan handling (URL: ?key=...&tag_id=...)
// ============================================================
function viewTagResult(result) {
  if (!result || !result.success) {
    return `<div class="card" style="max-width:420px;margin:60px auto;text-align:center;">
      <h2>Prieiga uždrausta</h2>
      <p class="muted">Šis pakabukas negalioja arba nuoroda buvo pakeista.</p>
    </div>`;
  }
  const t = result.tag;
  if (!t.registered) {
    return `<div class="card" style="max-width:420px;margin:60px auto;">
      <h2>Pakabukas dar nepriregistruotas</h2>
      <p class="muted">ID: ${escapeHtml(t.tagId)} · Modelis: ${escapeHtml(t.modelType)}</p>
      <p>Prisijunkite prie savo paskyros ir priregistruokite šį pakabuką.</p>
      <button class="btn btn-primary" onclick="navigate('login')">Prisijungti</button>
    </div>`;
  }
  return `<div class="card" style="max-width:460px;margin:40px auto;">
    <h2>${escapeHtml(t.petName || 'Augintinis')}</h2>
    <p class="muted">Pakabuko ID: ${escapeHtml(t.tagId)}</p>
    ${t.safeMode ? `<div class="alert-box alert-success">Augintinis saugus namuose</div>` : ''}
    <p><strong>Savininkas:</strong> ${escapeHtml(t.ownerFirstName || '—')}</p>
    <p><strong>Kontaktinis el. paštas:</strong> ${escapeHtml(t.contactEmail || '—')}</p>
    ${t.modelType === 'Pro' ? `
      ${t.streetName ? `<p><strong>Gatvė:</strong> ${escapeHtml(t.streetName)}</p>` : ''}
      ${t.meetingPlace ? `<p><strong>Susitikimo vieta:</strong> ${escapeHtml(t.meetingPlace)}</p>` : ''}
      ${t.vetDetails ? `<p><strong>Veterinaras:</strong> ${escapeHtml(t.vetDetails)}</p>` : ''}
      ${t.allergies ? `<p><strong>Alergijos:</strong> ${escapeHtml(t.allergies)}</p>` : ''}
      ${t.microchipStatus ? `<p>Turi mikroschemą</p>` : ''}
    ` : ''}
    <p class="muted" style="font-size:13px;margin-top:16px;">Savininkas buvo informuotas apie šį nuskaitymą.</p>
  </div>`;
}

async function handleTagUrlIfPresent() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get('key');
  const tagId = params.get('tag_id');
  if (!key || !tagId) return false;
  const res = await Api.getPublic({ key, tag_id: tagId });
  State._tagResult = res;
  State.view = 'tagResult';
  return true;
}

// ============================================================
// Init
// ============================================================
(async function init() {
  Cookies.init();
  const cameFromScan = await handleTagUrlIfPresent();
  if (!cameFromScan && State.sessionToken) State.view = 'dashboard';
  render();
})();
</script>
</body>
</html>
