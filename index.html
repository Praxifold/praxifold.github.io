<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxifold</title>
<style>
:root{--bg:#000000;--panel:#080d1a;--panel2:#0c1426;--border:#162545;--text:#c8d8f0;--dim:#4a6a9a;--accent:#4080ff;--accent2:#1c5fd4;--danger:#e53e3e;--ok:#38a169;--r:10px;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h2,h3{font-weight:700;letter-spacing:-.02em}
.hidden{display:none!important}
.muted{color:var(--dim);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.card+.card{margin-top:14px}
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 13px;font-size:14px;font-family:var(--font);margin-top:4px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(64,128,255,.18)}
select option{background:var(--panel2)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;color:var(--dim);margin-top:12px;font-weight:500;letter-spacing:.02em}
label.inline{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--text);margin-top:14px;cursor:pointer;font-weight:400;letter-spacing:0}
label.inline input[type=checkbox]{width:auto;margin:2px 0 0;flex-shrink:0}
.field{margin-bottom:2px}
.pw-wrap{position:relative;margin-top:4px}
.pw-wrap input{margin-top:0;padding-right:42px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--dim);padding:4px;font-size:15px;line-height:1;transition:color .15s}
.pw-eye:hover{color:var(--text)}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s,transform .1s,background .15s;font-family:var(--font)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){opacity:.88}
.btn-sm{padding:6px 13px;font-size:13px}
.btn-block{width:100%;margin-top:14px}
.alert{padding:11px 14px;border-radius:8px;font-size:14px;margin:10px 0}
.alert-error{background:rgba(229,62,62,.12);border:1px solid rgba(229,62,62,.4);color:#fca5a5}
.alert-ok{background:rgba(56,161,105,.12);border:1px solid rgba(56,161,105,.4);color:#86efac}
.alert-info{background:rgba(64,128,255,.1);border:1px solid rgba(64,128,255,.35);color:#93c5fd}
header{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;cursor:pointer;letter-spacing:-.02em}
.brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#60a5fa);flex-shrink:0;box-shadow:0 0 14px rgba(64,128,255,.4)}
.topnav{display:flex;gap:8px;align-items:center}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-right:4px}
.lang-toggle button{background:none;border:none;color:var(--dim);padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background .15s,color .15s}
.lang-toggle button.active{background:var(--panel2);color:var(--accent)}
main{max-width:1060px;margin:0 auto;padding:30px 18px 80px}
.fade-in{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:64px 10px 10px}
.hero h1{font-size:40px;font-weight:800;margin-bottom:10px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--text),#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--dim);font-size:16px;margin-bottom:28px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sublink{margin-top:18px;font-size:14px;color:var(--dim);cursor:pointer;text-decoration:underline;display:inline-block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:none;color:var(--dim);padding:10px 15px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font);transition:color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row span{font-size:14px}
.sw{position:relative;width:40px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;margin:0}
.sl{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.2s}
.sl::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:var(--accent)}
input:checked+.sl::before{transform:translateX(18px)}
.switch-row .sw input:disabled+.sl{opacity:.5;cursor:not-allowed}
.sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 0 8px;font-weight:600}
.tag-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
.pill.active{border-color:var(--ok);color:var(--ok)}
.pill.pending{border-color:var(--accent);color:var(--accent)}
.copy-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.copy-row input{flex:1;margin:0;font-size:12px;font-family:monospace;background:var(--bg)}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{overflow:hidden;padding:0;transition:border-color .15s}
.pcard:hover{border-color:var(--accent)}
.pphoto{width:100%;aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;overflow:hidden}
.pphoto img{width:100%;height:100%;object-fit:cover}
.pbody{padding:14px}
.pbody h4{margin-bottom:4px;font-size:15px}
.pprice{color:var(--accent);font-weight:700;font-size:18px;margin:5px 0}
.cat-ctrls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cat-ctrls input{flex:1;min-width:160px;margin:0}
.cat-ctrls select{width:auto;margin:0}
.adm-sec{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.adm-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.adm-sec h4{margin-bottom:12px;font-size:15px;color:var(--text)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th,table.dt td{border:1px solid var(--border);padding:5px 8px;text-align:left;white-space:nowrap}
table.dt th{background:var(--panel2);color:var(--dim);font-weight:600}
.dt-wrap{overflow-x:auto;max-height:350px;overflow-y:auto}
footer{text-align:center;padding:24px 18px 60px;color:var(--dim);font-size:13px}
footer a{margin:0 8px;color:var(--dim)}footer a:hover{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;animation:fi .18s ease}
.modal h3{margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#cookie{position:fixed;bottom:0;left:0;right:0;background:var(--panel2);border-top:1px solid var(--border);padding:14px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:60}
#cookie p{font-size:14px;color:var(--dim);margin:0;max-width:580px}
#cookie .ca{display:flex;gap:8px}
#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:8px;font-size:14px;max-width:320px;animation:fi .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast-ok{background:#166534;color:#bbf7d0;border:1px solid #16a34a}
.toast-error{background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444}
.toast-info{background:#1e3a5f;color:#93c5fd;border:1px solid #3b82f6}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:100;transition:width .25s ease,opacity .3s;box-shadow:0 0 8px var(--accent)}
.scan-card{max-width:480px;margin:40px auto}
.scan-safe{display:flex;align-items:center;gap:8px;background:rgba(56,161,105,.12);border:1px solid rgba(56,161,105,.4);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--ok);font-weight:600}
.info-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--dim);min-width:130px;flex-shrink:0}
#geo-loading{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center}
#geo-block{position:fixed;inset:0;background:#000;z-index:201;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#dev-warn{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444;padding:11px 20px;border-radius:8px;z-index:95;font-size:14px;animation:fi .2s ease;max-width:340px;text-align:center}
</style>
</head>

    <div style="color:#4a6a9a;font-size:14px;font-family:'Segoe UI',system-ui,sans-serif">Praxifold</div>
  </div>
</div>
<div id="geo-block" class="hidden">

    <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#4080ff,#60a5fa);margin:0 auto 20px"></div>

async function hmacHex(kh,msg){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(kh),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const s=await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ks(kh,nonce,len){
  const bytes=[]; let c=0;
  while(bytes.length<len){ const h=await hmacHex(kh,nonce+':'+c); for(let i=0;i<h.length;i+=2) bytes.push(parseInt(h.substr(i,2),16)); c++; }
  return bytes.slice(0,len);
}
function rndHex(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function encPay(kh,obj){
  const pt=Array.from(new TextEncoder().encode(JSON.stringify(obj)));
  const n=rndHex(16),k=await ks(kh,n,pt.length);
  const c=pt.map((b,i)=>(b^k[i]).toString(16).padStart(2,'0')).join('');
  return {n,c,t:await hmacHex(kh,n+':'+c)};
}
async function decPay(kh,enc){
  if(await hmacHex(kh,enc.n+':'+enc.c)!==enc.t) throw new Error('Integrity fail');
  const ct=[]; for(let i=0;i<enc.c.length;i+=2) ct.push(parseInt(enc.c.substr(i,2),16));
  const k=await ks(kh,enc.n,ct.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(ct.map((b,i)=>b^k[i]))));
}

const LS={g:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},s:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};

const SM={
  at:null,rt:null,ek:null,email:null,fullName:null,role:null,userId:null,_t:null,
  load(){
    this.at=LS.g('at');this.rt=LS.g('rt');this.ek=LS.g('ek');
    this.email=LS.g('em');this.fullName=LS.g('fn');this.role=LS.g('ro')||'';this.userId=LS.g('uid');
    if(this.at&&this.rt) this._sched();
  },
  save(d,email){
    if(email){this.email=email;LS.s('em',email);}
    if(d.accessToken){this.at=d.accessToken;LS.s('at',d.accessToken);}
    if(d.refreshToken){this.rt=d.refreshToken;LS.s('rt',d.refreshToken);}
    if(d.encryptionKey){this.ek=d.encryptionKey;LS.s('ek',d.encryptionKey);}
    if(d.fullName!==undefined){this.fullName=d.fullName;LS.s('fn',d.fullName||'');}
    if(d.role!==undefined){this.role=d.role;LS.s('ro',d.role||'');}
    if(d.userId){this.userId=d.userId;LS.s('uid',d.userId);}
    this._sched();
  },
  _sched(){ clearTimeout(this._t); this._t=setTimeout(()=>this._ref(), 18*60*1000); },
  async _ref(){
    if(!this.rt||!this.email) return;
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'refreshSession',payload:{refreshToken:this.rt,email:this.email}})});
      const d=await r.json();
      if(d.success){this.save(d);}
      else if(d.code==='SESSION_REVOKED'||d.code==='SESSION_EXPIRED'){this.clear();navigate('login');toast(t('sessionExpired'),'error');}
      else{this._sched();}
    }catch(_){this._sched();}
  },
  clear(){
    clearTimeout(this._t);
    this.at=this.rt=this.ek=this.email=this.fullName=this.role=this.userId=null;
    ['at','rt','ek','em','fn','ro','uid'].forEach(k=>localStorage.removeItem(k));
  },
  get ok(){ return !!(this.at&&this.rt); },
  get isAdmin(){ return this.role==='admin'||this.role==='developer'; },
  get isDev()  { return this.role==='developer'; }
};

const prog={
  el:null,
  start(){ if(!this.el) this.el=document.getElementById('prog'); if(this.el){this.el.style.cssText='width:65%;opacity:1';} },
  done(){ if(!this.el) return; this.el.style.width='100%'; setTimeout(()=>{if(this.el)this.el.style.cssText='width:0;opacity:0';},300); }
};

const API={
  async call(action,payload,raw){
    payload=Object.assign({},payload||{});
    const body={action};
    prog.start();
    if(SM.ek&&SM.at&&!raw){
      body.tok=SM.at;
      body.enc=await encPay(SM.ek,payload);
    } else {
      if(SM.at) payload.accessToken=SM.at;
      body.payload=payload;
    }
    let data;
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
      data=await r.json();
    }catch(_){prog.done();return {success:false,code:'NETWORK',message:t('networkError')};}
    if(data.enc&&SM.ek){
      try{data=await decPay(SM.ek,data.enc);}
      catch(_){prog.done();return {success:false,code:'DECRYPT',message:t('networkError')};}
    }
    prog.done();
    if(data.code==='SESSION_EXPIRED'||data.code==='SESSION_REVOKED'){SM.clear();navigate('login');toast(t('sessionExpired'),'error');}
    return data;
  },
  async pub(params){
    const url=new URL(API_URL);
    Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));
    prog.start();
    try{const r=await fetch(url);const d=await r.json();prog.done();return d;}
    catch(_){prog.done();return {success:false,code:'NETWORK',message:t('networkError')};}
  }
};

async function checkGeo(){
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),2500);
    const r=await fetch('https://www.cloudflare.com/cdn-cgi/trace',{signal:ctrl.signal});
    clearTimeout(timer);
    const text=await r.text();
    const m=text.match(/loc=([A-Z]{2})/);
    if(m&&m[1]!=='LT'){
      document.getElementById('geo-loading').classList.add('hidden');
      document.getElementById('geo-block').classList.remove('hidden');
      return false;
    }
  }catch(_){}
  document.getElementById('geo-loading').classList.add('hidden');
  return true;
}

async function renderDash(){
  const app=document.getElementById('app');

  SM.save({fullName:r.fullName,role:r.role,userId:r.userId});
  State._dash=r;
  let tabs=`<button class="tab active" data-tab="tags" onclick="switchTab('tags')">${t('myTags')}</button>`;

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const el=document.getElementById('tc');
  if(tab==='tags')     el.innerHTML=renderTagsTab();
  if(tab==='admin')    el.innerHTML=renderAdminTab();
  if(tab==='dev')      renderDevTab(el);
  if(tab==='settings') el.innerHTML=renderSettingsTab();
}

const smTimers={};
async function toggleSafeModeUI(e,tagId){
  const cb=e.target;
  if(smTimers[tagId]){cb.checked=!cb.checked;toast(t('smCooldown'),'info');return;}
  cb.disabled=true;
  smTimers[tagId]=true;
  const r=await API.call('toggleSafeMode',{tagId,safeMode:cb.checked});
  cb.disabled=false;
  if(!r.success){cb.checked=!cb.checked;toast(em(r),'error');}
  setTimeout(()=>delete smTimers[tagId],15000);
}

async function loadDevSheet(name){
  const wrap=document.getElementById('dev-sheet-wrap');
  if(wrap) wrap.innerHTML=`<p class="muted">${t('loading')}</p>`;
  const r=await API.call('adminGetSheet',{sheetName:name});
  if(!wrap||!r.success){if(wrap)wrap.innerHTML=`<div class="alert alert-error">${esc(em(r))}</div>`;return;}
  const cols=r.columns.filter(c=>!c.startsWith('Password')),rows=r.rows||[];
  wrap.innerHTML=`<div class="dt-wrap"><table class="dt"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows.map(row=>`<tr>${cols.map(c=>`<td title="${esc(String(row[c]??''))}">${esc(String(row[c]??'').substring(0,60))}</td>`).join('')}

function openEditModal(row,sheetName){
  API.call('adminGetSheet',{sheetName}).then(res=>{
    if(!res.success) return;
    const rec=res.rows.find(r=>r._row===row); if(!rec) return;
    const cols=res.columns.filter(c=>!c.startsWith('Password')&&c!=='_row'&&c!=='_url');
    modal(`<h3 style="margin-bottom:14px">${t('editRecord')}: ${esc(sheetName)}</h3>
      ${cols.map(c=>`<label style="margin-bottom:2px">${esc(c)}<input id="ef-${esc(c.replace(/[\s+]/g,'_'))}" value="${esc(String(rec[c]??''))}"></label>`).join('')}

      <div class="modal-btns" style="margin-top:12px">
        <button class="btn btn-primary" onclick="withBtn(this,()=>submitEditRecord(${row},'${esc(sheetName)}',[${cols.map(c=>`'${esc(c)}'`).join(',')}]))">${t('save')}</button>
      </div>`);
  });
}

      ${tag.contactEmail?`<div class="info-row"><span class="lbl">${t('emailLbl')}</span><a href="mailto:${esc(tag.contactEmail)}">${esc(tag.contactEmail)}</a></div>`:''}
      ${tag.model==='Pro'&&tag.streetAddress?`<div class="info-row"><span class="lbl">${t('streetAddress')}</span>${esc(tag.streetAddress)}</div>`:''}
      ${tag.model==='Pro'&&tag.additionalEmail?`<div class="info-row"><span class="lbl">${t('additionalEmail')}</span><a href="mailto:${esc(tag.additionalEmail)}">${esc(tag.additionalEmail)}</a></div>`:''}
      ${tag.model==='Pro'&&tag.meetingSpot?`<div class="info-row"><span class="lbl">${t('meetingSpot')}</span>${esc(tag.meetingSpot)}</div>`:''}
      ${tag.model==='Pro'&&tag.vetInfo?`<div class="info-row"><span class="lbl">${t('vetInfo')}</span>${esc(tag.vetInfo)}</div>`:''}
      ${tag.model==='Pro'&&tag.microchipNumber?`<div class="info-row"><span class="lbl">${t('microchipNumber')}</span>${esc(tag.microchipNumber)}</div>`:''}
      ${tag.model==='Pro'&&tag.allergies?`<div class="info-row"><span class="lbl">${t('allergies')}</span>${esc(tag.allergies)}</div>`:''}
      ${tag.model==='Pro'&&tag.age?`<div class="info-row"><span class="lbl">${t('age')}</span>${esc(tag.age)}</div>`:''}
      ${tag.model==='Pro'&&tag.breed?`<div class="info-row"><span class="lbl">${t('breed')}</span>${esc(tag.breed)}</div>`:''}
      ${tag.model==='Pro'&&tag.notes?`<div class="info-row"><span class="lbl">${t('notes')}</span>${esc(tag.notes)}</div>`:''}
    </div>
    <p class="muted" style="margin-top:14px;font-size:12px">${t('scanAlerted')}</p>
  </div>`;
}

function vActivation(){
  const p=State._tagParams||{};
  return `<div class="card scan-card">
    <h2 style="margin-bottom:10px">${t('activationTitle')}</h2>
    <p class="muted" style="margin-bottom:16px">${t('activationInfo')}</p>
    <div id="act-alert"></div>
    ${!SM.ok?`<label>${t('email')}<input id="act-email" type="email" onkeydown="hk(event,'act-submit')"></label>
      ${pwField('act-pw','password','act-submit')}
      <button id="act-submit" class="btn btn-primary btn-block" onclick="withBtn(this,loginAndActivate)">${t('loginToActivate')}</button>`
    :`<button id="act-submit" class="btn btn-primary btn-block" onclick="withBtn(this,doActivate)">${t('activateBtn')}</button>`}
  </div>`;
}
async function loginAndActivate(){
  const email=document.getElementById('act-email').value.trim(),pw=document.getElementById('act-pw').value;
  const lr=await API.call('login',{email,password:pw},true);
  if(!lr.success){showAlert('act-alert',em(lr));return;}
  SM.save(lr,email); await doActivate();
}
async function doActivate(){
  const p=State._tagParams||{};
  const r=await API.call('activateTag',{tagId:p.tagId,key:p.key});
  if(r.success){showAlert('act-alert',t('activationOk'),'ok');setTimeout(()=>navigate('dashboard'),1600);}
  else showAlert('act-alert',em(r));
}

async function init(){
  initDevBlock();
  const allowed=await checkGeo();
  if(!allowed) return;
  initCookies();
  SM.load();
  const params=new URLSearchParams(window.location.search);
  const resetTok=params.get('reset'),setupTok=params.get('setup'),uid=params.get('uid');
  const key=params.get('key'),tagId=params.get('tag_id'),isAct=params.get('activation')==='1';
  if(resetTok&&uid){State._resetParams={token:resetTok,uid};State.view='resetForm';render();return;}
  if(setupTok&&uid){State._setupParams={token:setupTok,uid};State.view='setup';render();return;}
  if(key&&tagId){
    const res=await API.pub({key,tag_id:tagId});
    State._tagResult=res; State._tagParams={key,tagId};
    State.view=(res.success&&res.tag&&res.tag.status==='Pending Activation')||isAct?'activation':'tagScan';
    render(); return;
  }
  State.view=SM.ok?'dashboard':'landing';
  render();
}
init();
</script>
