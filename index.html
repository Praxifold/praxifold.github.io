<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxifold</title>
<style>
  :root {
    --bg: #0e1a1a; --bg-panel: #142524; --bg-panel-2: #1b312f; --border: #26433f;
    --text: #eaf2ef; --text-dim: #9db3ae; --accent: #e8a33d; --danger: #d9534f;
    --success: #4caf7d; --radius: 10px; --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--accent); }
  h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; }
  .hidden { display: none !important; }
  .muted { color: var(--text-dim); }
  .help-text { font-size: 12px; color: var(--text-dim); margin: -8px 0 12px; }

  header.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(14,26,26,0.92); backdrop-filter: blur(6px); z-index: 50; flex-wrap: wrap; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #f2c374); display: inline-block; }
  nav.topnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

  .btn { border: none; border-radius: var(--radius); padding: 11px 20px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .12s ease, opacity .12s ease; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }
  .btn-primary { background: var(--accent); color: #14201a; }
  .btn-primary:hover:not(:disabled) { opacity: 0.92; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-small { padding: 7px 14px; font-size: 13px; }
  .btn-block { width: 100%; }

  .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }

  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: var(--font); margin-bottom: 12px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0; font-size: 13px; color: var(--text-dim); }
  .checkbox-row input { width: auto; margin: 3px 0 0; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-child { border-bottom: none; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; margin: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(18px); }

  .hero { text-align: center; padding: 60px 10px 20px; }
  .hero h1 { font-size: 40px; margin-bottom: 8px; }
  .hero p { color: var(--text-dim); font-size: 16px; margin-bottom: 28px; }
  .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .subtext-link { display: block; margin-top: 18px; font-size: 14px; color: var(--text-dim); cursor: pointer; text-decoration: underline; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-box { background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; max-width: 460px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .modal-box h3 { margin-top: 0; }
  .modal-close-row { text-align: right; margin-top: 18px; }

  #cookie-banner { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel-2); border-top: 1px solid var(--border); padding: 16px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 90; }
  #cookie-banner p { margin: 0; font-size: 14px; color: var(--text-dim); max-width: 560px; }
  .cookie-actions { display: flex; gap: 10px; }

  .catalog-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .catalog-controls input { margin-bottom: 0; flex: 1; min-width: 180px; }
  .catalog-controls select { margin-bottom: 0; width: auto; }
  .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .product-card { overflow: hidden; padding: 0; }
  .product-photo { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; overflow: hidden; }
  .product-photo img { width: 100%; height: 100%; object-fit: cover; }
  .product-body { padding: 14px; }
  .product-body h4 { margin: 0 0 4px; font-size: 15px; }
  .product-price { color: var(--accent); font-weight: 700; margin: 4px 0; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg-panel-2); border: 1px solid var(--border); color: var(--text-dim); margin-top: 6px; }

  .dash-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 6px; margin: 18px 0 22px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tag-card { margin-bottom: 14px; }
  .tag-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .tag-id-pill { font-size: 12px; color: var(--text-dim); font-family: monospace; }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 16px 0 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
  .subcard { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 18px; }
  .subcard:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  .alert-box { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .alert-error { background: rgba(217,83,79,0.15); border: 1px solid var(--danger); color: #f3aeac; }
  .alert-success { background: rgba(76,175,125,0.15); border: 1px solid var(--success); color: #a6e2c2; }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.admin-table th, table.admin-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; white-space: nowrap; }
  .admin-table-wrap { overflow-x: auto; }
  footer.sitefooter { text-align: center; padding: 30px 20px 90px; color: var(--text-dim); font-size: 13px; }
  footer.sitefooter a { margin: 0 8px; }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lang-toggle button { background: transparent; border: none; color: var(--text-dim); padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .lang-toggle button.active { background: var(--accent); color: #14201a; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span> Praxifold</div>

</div>

function t(key) { return (TR[State.lang] && TR[State.lang][key]) || TR.lt[key] || key; }
function tErr(res) {
  if (res && res.code && ERROR_MESSAGES[res.code]) return ERROR_MESSAGES[res.code][State.lang] || ERROR_MESSAGES[res.code].lt;
  return (res && res.message) || (State.lang === 'en' ? 'Something went wrong.' : 'Įvyko klaida.');
}

// ============================================================
// Crypto (client) — mirrors Code.gs's HMAC keystream, encrypt-then-MAC
// ============================================================
function hexToBytes(hex) { const out = []; for (let i = 0; i < hex.length; i += 2) out.push(parseInt(hex.substr(i, 2), 16)); return out; }
function bytesToHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''); }
function randomHex(byteLen) { const arr = new Uint8Array(byteLen); crypto.getRandomValues(arr); return bytesToHex(arr); }

async function hmacSha256Hex(keyHex, message) {
  const cryptoKey = await crypto.subtle.importKey('raw', new Uint8Array(hexToBytes(keyHex)), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(message));
  return bytesToHex(new Uint8Array(sig));
}
async function keystreamBytes(keyHex, nonceHex, lengthBytes) {
  let bytes = []; let counter = 0;
  while (bytes.length < lengthBytes) { bytes = bytes.concat(hexToBytes(await hmacSha256Hex(keyHex, nonceHex + ':' + counter))); counter++; }
  return bytes.slice(0, lengthBytes);
}
async function encryptForServer(keyHex, obj) {
  const ptBytes = Array.from(new TextEncoder().encode(JSON.stringify(obj)));
  const nonceHex = randomHex(16);
  const keystream = await keystreamBytes(keyHex, nonceHex, ptBytes.length);
  const ciphertextHex = bytesToHex(ptBytes.map((b, i) => b ^ keystream[i]));
  return { nonce: nonceHex, ciphertext: ciphertextHex, tag: await hmacSha256Hex(keyHex, nonceHex + ':' + ciphertextHex) };
}
async function decryptFromServer(keyHex, enc) {
  const expectedTag = await hmacSha256Hex(keyHex, enc.nonce + ':' + enc.ciphertext);
  if (expectedTag !== enc.tag) throw new Error('integrity check failed');
  const ctBytes = hexToBytes(enc.ciphertext);
  const keystream = await keystreamBytes(keyHex, enc.nonce, ctBytes.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(ctBytes.map((b, i) => b ^ keystream[i]))));
}

// ============================================================
// Auth: 5-minute rotating access token, 30-day rotating refresh token
// ============================================================
const Auth = {
  accessToken: localStorage.getItem('pxf_access') || null,
  refreshToken: localStorage.getItem('pxf_refresh') || null,
  encKey: localStorage.getItem('pxf_enckey') || null,
  email: localStorage.getItem('pxf_email') || null,
  fullName: localStorage.getItem('pxf_name') || null,
  role: localStorage.getItem('pxf_role') || '',
  userId: localStorage.getItem('pxf_uid') || null,
  refreshTimer: null,

  setFromTokens(tokens, extra) {
    this.accessToken = tokens.sessionToken;
    this.refreshToken = tokens.refreshToken;
    this.encKey = tokens.encryptionKey;
    if (extra) {
      if (extra.email !== undefined) this.email = extra.email;
      if (extra.fullName !== undefined) this.fullName = extra.fullName;
      if (extra.role !== undefined) this.role = extra.role;
      if (extra.userId !== undefined) this.userId = extra.userId;
    }
    localStorage.setItem('pxf_access', this.accessToken || '');
    localStorage.setItem('pxf_refresh', this.refreshToken || '');
    localStorage.setItem('pxf_enckey', this.encKey || '');
    localStorage.setItem('pxf_email', this.email || '');
    localStorage.setItem('pxf_name', this.fullName || '');
    localStorage.setItem('pxf_role', this.role || '');
    localStorage.setItem('pxf_uid', this.userId || '');
    this.scheduleRefresh();
  },
  clear() {
    this.accessToken = this.refreshToken = this.encKey = this.email = this.fullName = this.userId = null;
    this.role = '';
    ['pxf_access', 'pxf_refresh', 'pxf_enckey', 'pxf_email', 'pxf_name', 'pxf_role', 'pxf_uid'].forEach(k => localStorage.removeItem(k));
    if (this.refreshTimer) clearTimeout(this.refreshTimer);
  },
  isLoggedIn() { return !!this.refreshToken; },
  scheduleRefresh() {
    if (this.refreshTimer) clearTimeout(this.refreshTimer);
    this.refreshTimer = setTimeout(() => this.doRefresh(), 4 * 60 * 1000);
  },
  async doRefresh() {
    if (!this.refreshToken || !this.email) return false;
    let res;
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'refreshSession', payload: { refreshToken: this.refreshToken, email: this.email } }) });
      res = await r.json();
    } catch (e) { return false; }
    if (!res.success) { this.clear(); return false; }
    this.setFromTokens(res, { role: res.role, fullName: res.fullName });
    return true;
  }
};

// ============================================================
// API layer
// ============================================================
const Api = {
  async call(action, payload, opts) {
    opts = opts || {};
    payload = Object.assign({}, payload || {});
    const encrypt = !!opts.encrypt && Auth.accessToken && Auth.encKey;
    let body;
    if (encrypt) {
      body = JSON.stringify({ action, encrypted: await encryptForServer(Auth.encKey, payload), sessionToken: Auth.accessToken });
    } else {
      if (Auth.accessToken) payload.sessionToken = Auth.accessToken;
      body = JSON.stringify({ action, payload });
    }
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    if (!res.ok) return { success: false, code: 'NETWORK' };
    let data;
    try { data = await res.json(); } catch (e) { return { success: false, code: 'PARSE' }; }
    if (data.encrypted) {
      try { data = await decryptFromServer(Auth.encKey, data.encrypted); }
      catch (e) { return { success: false, code: 'DECRYPT_FAILED' }; }
    }
    if (!data.success && (data.code === 'SESSION_EXPIRED' || data.code === 'FORBIDDEN') && Auth.refreshToken && !opts._retried) {
      const refreshed = await Auth.doRefresh();
      if (refreshed) return Api.call(action, payload, Object.assign({}, opts, { _retried: true }));
    }
    return data;
  },
  async getPublic(params) {
    const url = new URL(API_URL);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    try { const res = await fetch(url.toString()); return await res.json(); }
    catch (e) { return { success: false, code: 'NETWORK' }; }
  }
};

async function runBusy(button, fn) {
  if (!button || button.disabled) return;
  const original = button.textContent;
  button.disabled = true;
  button.textContent = t('working');
  try { await fn(); } finally { button.disabled = false; button.textContent = original; }
}

    <div class="card subcard">
      <h3>${t('genTagTitle')}</h3>
      <div class="field"><label>${t('model')}</label><select id="gen-model"><option value="Base">Base</option><option value="Pro">Pro</option></select></div>
      <button class="btn btn-primary btn-small" onclick="submitGenerateTag(this)">${t('generate')}</button>
      <div id="gen-result" style="margin-top:14px;"></div>
    </div>
    <div class="card subcard">
      <h3>${t('claimTitle')}</h3><div id="claim-alert"></div>
      <div class="field"><label>${t('userIdLabel')}</label><input id="claim-userid"></div>
      <div class="field"><label>${t('tagIdLabel')}</label><input id="claim-tagid"></div>
      <button class="btn btn-primary btn-small" onclick="submitWarrantyClaim(this)">${t('startClaim')}</button>
    </div>
    <div class="card subcard">
      <h3>${t('transferTitle')}</h3><div id="transfer-alert"></div>
      <div class="field"><label>${t('oldTagId')}</label><input id="transfer-old"></div>
      <div class="field"><label>${t('newTagId')}</label><input id="transfer-new"></div>
      <button class="btn btn-primary btn-small" onclick="submitTransfer(this)">${t('transferBtn')}</button>
    </div>
    <div class="card subcard">
      <h3>${t('createCustomerTitle')}</h3><div id="invite-alert"></div>
      <div class="field"><label>${t('customerEmail')}</label><input id="invite-email" type="email"></div>
      <button class="btn btn-primary btn-small" onclick="submitInviteCustomer(this)">${t('sendInvite')}</button>
      <button class="btn btn-ghost btn-small" id="manual-fallback-btn" style="margin-left:8px;" disabled onclick="showManualCreateForm()">${t('manualFallback')}</button>
      <div id="manual-create-area" style="margin-top:14px;"></div>
    </div>
    <div class="card subcard">
      <h3>${t('deleteCustomerTitle')}</h3><div id="delcust-alert"></div>
      <div class="field"><label>${t('targetUserId')}</label><input id="delcust-userid"></div>
      <div class="field"><label>${t('targetEmail')}</label><input id="delcust-email" type="email"></div>
      <div class="field"><label>${t('yourPassword')}</label><input id="delcust-adminpass" type="password"></div>
      <button class="btn btn-danger btn-small" onclick="submitRequestDeleteCustomer(this)">${t('sendCode')}</button>
      <div id="delcust-step2" class="hidden" style="margin-top:14px;">
        <div class="field"><label>${t('verificationCode')}</label><input id="delcust-code"></div>
        <button class="btn btn-danger btn-small" onclick="submitConfirmDeleteCustomer(this)">${t('confirmDelete')}</button>
      </div>
    </div>`;
}

async function submitGenerateTag(btn) {
  await runBusy(btn, async () => {
    const modelType = document.getElementById('gen-model').value;
    const res = await Api.call('generateTag', { modelType }, { encrypt: true });
    const el = document.getElementById('gen-result');
    if (!res.success) { el.innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`; return; }
    el.innerHTML = `<div class="alert-box alert-success">${t('tagCreated')} ${escapeHtml(res.tagId)}</div>
      <label>${t('linkLabel')}</label><input readonly value="${escapeHtml(res.url)}" onclick="this.select()">`;
  });
}
async function submitWarrantyClaim(btn) {
  await runBusy(btn, async () => {
    const userId = document.getElementById('claim-userid').value.trim();
    const tagId = document.getElementById('claim-tagid').value.trim();
    const res = await Api.call('openWarrantyClaim', { userId, tagId }, { encrypt: true });
    document.getElementById('claim-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('claimSent')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
async function submitTransfer(btn) {
  await runBusy(btn, async () => {
    const oldTagId = document.getElementById('transfer-old').value.trim();
    const newTagId = document.getElementById('transfer-new').value.trim();
    const res = await Api.call('transferTagData', { oldTagId, newTagId }, { encrypt: true });
    document.getElementById('transfer-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('transferDone')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
async function submitInviteCustomer(btn) {
  await runBusy(btn, async () => {
    const email = document.getElementById('invite-email').value.trim();
    const res = await Api.call('adminInviteCustomer', { email }, { encrypt: true });
    document.getElementById('invite-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('inviteSent')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
    if (res.success) {
      const fbBtn = document.getElementById('manual-fallback-btn');
      let remaining = Math.ceil(MANUAL_FALLBACK_DELAY_MS / 1000);
      fbBtn.textContent = `${t('manualFallback')} (${t('manualFallbackWait')} ${remaining}s)`;
      const iv = setInterval(() => {
        remaining--;
        if (remaining <= 0) { clearInterval(iv); fbBtn.disabled = false; fbBtn.textContent = t('manualFallback'); }
        else fbBtn.textContent = `${t('manualFallback')} (${t('manualFallbackWait')} ${remaining}s)`;
      }, 1000);
    }
  });
}
function showManualCreateForm() {
  const email = document.getElementById('invite-email').value.trim();
  document.getElementById('manual-create-area').innerHTML = `
    <div class="field"><label>${t('customerEmail')}</label><input id="manual-email" value="${escapeHtml(email)}"></div>
    <div class="field"><label>${t('password')}</label><input id="manual-password" type="password" minlength="10"></div>
    <p class="help-text">${t('passwordHint')}</p>
    <button class="btn btn-primary btn-small" onclick="submitManualCreateCustomer(this)">${t('manualCreate')}</button>
    <div id="manual-alert" style="margin-top:10px;"></div>`;
}
async function submitManualCreateCustomer(btn) {
  await runBusy(btn, async () => {
    const email = document.getElementById('manual-email').value.trim();
    const password = document.getElementById('manual-password').value;
    const res = await Api.call('adminManualCreateCustomer', { email, password }, { encrypt: true });
    document.getElementById('manual-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('saved')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
async function submitRequestDeleteCustomer(btn) {
  await runBusy(btn, async () => {
    const targetUserId = document.getElementById('delcust-userid').value.trim();
    const targetEmail = document.getElementById('delcust-email').value.trim();
    const adminPassword = document.getElementById('delcust-adminpass').value;
    const res = await Api.call('adminRequestDeleteCustomer', { targetUserId, targetEmail, adminPassword }, { encrypt: true });
    document.getElementById('delcust-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('codeSent')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
    if (res.success) document.getElementById('delcust-step2').classList.remove('hidden');
  });
}
async function submitConfirmDeleteCustomer(btn) {
  await runBusy(btn, async () => {
    const targetUserId = document.getElementById('delcust-userid').value.trim();
    const code = document.getElementById('delcust-code').value.trim();
    const res = await Api.call('adminConfirmDeleteCustomer', { targetUserId, code }, { encrypt: true });
    document.getElementById('delcust-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('accountDeleted')}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}

      <button class="btn btn-danger btn-small" onclick="submitPurge(this)">${t('purgeBtn')}</button>
    </div>
    <div class="card subcard">
      <h3>${t('createUserTitle')}</h3><div id="devcreate-alert"></div>
      <div class="grid-2">
        <div class="field"><label>${t('fullName')}</label><input id="devcreate-name"></div>
        <div class="field"><label>${t('email')}</label><input id="devcreate-email" type="email"></div>
        <div class="field"><label>${t('password')}</label><input id="devcreate-password" type="password" minlength="10"></div>
        <div class="field"><label>${t('roleLabel')}</label><select id="devcreate-role">
          <option value="">${t('roleCustomer')}</option><option value="admin">${t('roleAdmin')}</option><option value="developer">${t('roleDev')}</option>
        </select></div>
      </div>
      <button class="btn btn-primary btn-small" onclick="submitDevCreateUser(this)">${t('createUserBtn')}</button>
    </div>
    <div class="card subcard">
      <h3>${t('devRawTitle')}</h3>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn btn-ghost btn-small" onclick="loadAdminSheet('Users')">Users</button>
        <button class="btn btn-ghost btn-small" onclick="loadAdminSheet('Tags')">Tags</button>

async function submitPurge(btn) {
  await runBusy(btn, async () => {
    const res = await Api.call('purgeScheduledDeletions', {}, { encrypt: true });
    document.getElementById('purge-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('purgeDone')} ${res.deletedCount}</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
async function submitDevCreateUser(btn) {
  await runBusy(btn, async () => {
    const fullName = document.getElementById('devcreate-name').value.trim();
    const email = document.getElementById('devcreate-email').value.trim();
    const password = document.getElementById('devcreate-password').value;
    const role = document.getElementById('devcreate-role').value;
    const res = await Api.call('devCreateUser', { fullName, email, password, role }, { encrypt: true });
    document.getElementById('devcreate-alert').innerHTML = res.success ? `<div class="alert-box alert-success">${t('saved')} (${res.userId})</div>` : `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
async function loadAdminSheet(sheetName) {
  const content = document.getElementById('admin-sheet-content');
  content.innerHTML = t('loading');
  const res = await Api.call('adminGetSheet', { sheetName }, { encrypt: true });
  if (!res.success) { content.innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`; return; }
  const cols = res.columns, rows = res.rows;
  content.innerHTML = `<table class="admin-table"><thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}<th>${t('actions')}</th></tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(String(r[c] ?? ''))}</td>`).join('')}
      <td><button class="btn btn-danger btn-small" onclick="adminDeleteRow('${sheetName}',${r._row})">${t('delete')}</button></td></tr>`).join('')}
    </tbody></table>`;
}
async function adminDeleteRow(sheetName, row) {
  if (!confirm(t('confirmDeleteRow'))) return;
  const res = await Api.call('adminDeleteRecord', { sheetName, row }, { encrypt: true });
  if (res.success) loadAdminSheet(sheetName); else alert(tErr(res));
}

// ---- Settings tab ----
function renderSettingsTab() {
  const d = State._dashboard;
  const deletionBlock = d.deletionScheduled
    ? `<p class="muted">${t('deletionScheduledNote')} ${new Date(d.deletionDate).toLocaleDateString(State.lang === 'en' ? 'en-US' : 'lt-LT')}</p>
       <button class="btn btn-ghost" onclick="submitCancelDeletion(this)">${t('cancelDeletion')}</button>`
    : `<p class="muted" style="margin-top:0;">${t('deleteIrreversible')}</p><button class="btn btn-danger" onclick="openDeleteAccountModal()">${t('deleteAccountBtn')}</button>`;

  return `<div class="card" style="max-width:480px;">
    <h3>${t('accountInfo')}</h3>
    <p style="margin:0 0 4px;"><strong>${t('email')}:</strong> ${escapeHtml(d.email || '')}</p>
    <p style="margin:0 0 4px;"><strong>${t('yourUserId')}:</strong> <span class="tag-id-pill">${escapeHtml(d.userId || '')}</span></p>
    <p style="margin:0;"><strong>${t('role')}:</strong> ${escapeHtml(roleLabel(d.role))}</p>
    <hr style="border-color:var(--border);margin:20px 0;">
    <h3>${t('privacy')}</h3>
    <a class="btn btn-ghost" style="display:inline-block;text-decoration:none;" href="${POLICY_URL}" target="_blank" rel="noopener">${t('viewPolicy')}</a>
    <hr style="border-color:var(--border);margin:20px 0;">
    <h3 style="color:var(--danger);">${t('dangerZone')}</h3>
    <div id="settings-danger-alert"></div>
    ${deletionBlock}
  </div>`;
}
async function submitCancelDeletion(btn) {
  await runBusy(btn, async () => {
    const res = await Api.call('cancelAccountDeletion', {}, { encrypt: true });
    if (res.success) { renderDashboardView(); }
    else document.getElementById('settings-danger-alert').innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`;
  });
}
function openDeleteAccountModal() {
  showModal(`<h3>${t('deleteAccountBtn')}</h3><p class="muted">${t('deleteIrreversible')}</p>
    <div id="delete-account-alert"></div>
    <div class="field"><input id="delete-account-password" type="password" placeholder="${t('password')}"></div>
    <button class="btn btn-danger btn-block" onclick="submitDeleteAccount(this)">${t('deleteAccountBtn')}</button>`);
}
async function submitDeleteAccount(btn) {
  await runBusy(btn, async () => {
    const password = document.getElementById('delete-account-password').value;
    const res = await Api.call('deleteAccountRequest', { password }, { encrypt: true });
    const alertEl = document.getElementById('delete-account-alert');
    if (!res.success) { alertEl.innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`; return; }
    alertEl.innerHTML = `<div class="alert-box alert-success">${t('saved')}</div>`;
    setTimeout(() => { closeModal(); renderDashboardView(); }, 900);
  });
}

// ============================================================
// Tag scan / activation
// ============================================================
function viewTagResult(result) {
  if (!result || !result.success) {
    return `<div class="card" style="max-width:420px;margin:60px auto;text-align:center;"><h2>${t('accessDenied')}</h2><p class="muted">${t('accessDeniedBody')}</p></div>`;
  }
  const tag = result.tag;
  if (!tag.registered) {
    return `<div class="card" style="max-width:420px;margin:60px auto;">
      <h2>${t('notRegisteredTitle')}</h2><p class="muted">ID: ${escapeHtml(tag.tagId)} · ${t('model')}: ${escapeHtml(tag.modelType)}</p>
      <p>${t('notRegisteredBody')}</p><button class="btn btn-primary" onclick="navigate('login')">${t('login')}</button>
    </div>`;
  }
  return `<div class="card" style="max-width:460px;margin:40px auto;">
    <h2>${escapeHtml(tag.petName || t('petName'))}</h2><p class="muted">${t('tagIdLabel')}: ${escapeHtml(tag.tagId)}</p>
    ${tag.safeMode ? `<div class="alert-box alert-success">${t('safeAtHome')}</div>` : ''}
    <p><strong>${t('owner')}:</strong> ${escapeHtml(tag.ownerFirstName || '—')}</p>
    <p><strong>${t('contactEmail')}:</strong> ${escapeHtml(tag.contactEmail || '—')}</p>
    ${tag.modelType === 'Pro' ? `
      ${tag.streetName ? `<p><strong>${t('streetName')}:</strong> ${escapeHtml(tag.streetName)}</p>` : ''}
      ${tag.meetingPlace ? `<p><strong>${t('meetingPlace')}:</strong> ${escapeHtml(tag.meetingPlace)}</p>` : ''}
      ${tag.vetDetails ? `<p><strong>${t('vetDetails')}:</strong> ${escapeHtml(tag.vetDetails)}</p>` : ''}
      ${tag.allergies ? `<p><strong>${t('allergies')}:</strong> ${escapeHtml(tag.allergies)}</p>` : ''}
      ${tag.microchipStatus ? `<p>${t('hasMicrochip')}</p>` : ''}` : ''}
    <p class="muted" style="font-size:13px;margin-top:16px;">${t('scanNotice')}</p>
  </div>`;
}

function viewActivation(result, tagParams) {
  if (!result || !result.success) {
    return `<div class="card" style="max-width:420px;margin:60px auto;text-align:center;"><h2>${t('accessDenied')}</h2><p class="muted">${t('accessDeniedBody')}</p></div>`;
  }
  const loggedIn = Auth.isLoggedIn();
  return `<div class="card" style="max-width:440px;margin:40px auto;">
    <h2>${t('activationTitle')}</h2><p class="muted">${t('activationBody')}</p>
    <div id="activation-alert"></div>
    ${loggedIn
      ? `<button class="btn btn-primary btn-block" onclick="submitActivateTag(this,'${tagParams.tagId}','${tagParams.key}')">${t('activateBtn')}</button>`
      : `<form onsubmit="return submitActivationLogin(event,'${tagParams.tagId}','${tagParams.key}')">
           <div class="field"><label>${t('email')}</label><input id="activation-email" type="email" required></div>
           <div class="field"><label>${t('password')}</label><input id="activation-password" type="password" required></div>
           <button class="btn btn-primary btn-block" type="submit">${t('login')}</button>
         </form>`}
  </div>`;
}
async function submitActivationLogin(ev, tagId, key) {
  ev.preventDefault();
  const btn = ev.target.querySelector('button[type=submit]');
  await runBusy(btn, async () => {
    const email = document.getElementById('activation-email').value.trim();
    const password = document.getElementById('activation-password').value;
    const res = await Api.call('login', { email, password, browserInfo: navigator.userAgent });
    const alertEl = document.getElementById('activation-alert');
    if (!res.success) { alertEl.innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`; return; }
    Auth.setFromTokens(res, { email, fullName: res.fullName, role: res.role, userId: res.userId });
    render();
  });
  return false;
}
async function submitActivateTag(btn, tagId, key) {
  await runBusy(btn, async () => {
    const res = await Api.call('activateTag', { tagId, key }, { encrypt: true });
    const alertEl = document.getElementById('activation-alert');
    if (!res.success) { alertEl.innerHTML = `<div class="alert-box alert-error">${tErr(res)}</div>`; return; }
    alertEl.innerHTML = `<div class="alert-box alert-success">${t('activationSuccess')}</div>`;
    setTimeout(() => navigate('dashboard'), 1000);
  });
}

async function handleUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get('key');
  const tagId = params.get('tag_id');
  const setupToken = params.get('setup');
  const uid = params.get('uid');

  if (setupToken && uid) {
    State._setupToken = setupToken;
    State._setupUserId = uid;
    State.view = 'accountSetup';
    return true;
  }
  if (key && tagId) {
    const res = await Api.getPublic({ key, tag_id: tagId });
    State._tagResult = res;
    State._tagParams = { key, tagId };
    State.view = (res.success && res.tag && res.tag.needsActivation) ? 'activation' : 'tagResult';
    return true;
  }
  return false;
}

// ============================================================
// Init
// ============================================================
(async function init() {
  Cookies.init();
  if (Auth.isLoggedIn()) await Auth.doRefresh();
  const handled = await handleUrlParams();
  if (!handled && Auth.isLoggedIn()) State.view = 'dashboard';
  render();
})();
</script>
