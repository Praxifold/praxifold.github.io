<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxifold — Aktyvacija</title>
<style>
body{font-family:'Segoe UI',system-ui,sans-serif;background:#000;color:#c8d8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:40px 24px}
.dot{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4080ff,#60a5fa);margin:0 auto 16px;box-shadow:0 0 20px rgba(64,128,255,.4)}
p{color:#4a6a9a;margin-top:14px;font-size:14px}
.spin-ring{position:relative;width:44px;height:44px;margin:12px auto}
.spin-ring span{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#4080ff;animation:spinRingFade 1.2s linear infinite;will-change:opacity}
.spin-ring span:nth-child(1){transform:rotate(0deg) translateY(-17px);animation-delay:0s}
.spin-ring span:nth-child(2){transform:rotate(45deg) translateY(-17px);animation-delay:-1.05s}
.spin-ring span:nth-child(3){transform:rotate(90deg) translateY(-17px);animation-delay:-0.9s}
.spin-ring span:nth-child(4){transform:rotate(135deg) translateY(-17px);animation-delay:-0.75s}
.spin-ring span:nth-child(5){transform:rotate(180deg) translateY(-17px);animation-delay:-0.6s}
.spin-ring span:nth-child(6){transform:rotate(225deg) translateY(-17px);animation-delay:-0.45s}
.spin-ring span:nth-child(7){transform:rotate(270deg) translateY(-17px);animation-delay:-0.3s}
.spin-ring span:nth-child(8){transform:rotate(315deg) translateY(-17px);animation-delay:-0.15s}
@keyframes spinRingFade{0%,80%,100%{opacity:.15}40%{opacity:1}}
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <h2>Praxifold</h2>
  <div class="spin-ring"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <p>Nukreipiama... / Redirecting...</p>
</div>
<script>
(function(){
  var p=new URLSearchParams(window.location.search);
  var key=p.get('key')||p.get('k');
  var tagId=p.get('tag_id')||p.get('id');
  if(key&&tagId){
    window.location.replace('../?activation=1&key='+encodeURIComponent(key)+'&tag_id='+encodeURIComponent(tagId));
  } else {
    window.location.replace('../');
  }
})();
</script>
</body>
</html>
